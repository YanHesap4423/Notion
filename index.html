<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Bugünün Bilgisi</title>


<style>

/* =========================
   TEMEL
========================= */

* {
    box-sizing: border-box;
}


:root {

    --orange: #ff7a00;

    --orange-light: #ff922b;

    --orange-dark: #c75d00;


    --black: #000000;

    --card: #121212;

    --card-2: #171717;

    --border: #292929;

    --border-orange:
        rgba(255, 122, 0, 0.45);


    --text: #f2f2f2;

    --text-soft: #cfcfcf;

    --text-muted: #888888;

    --text-dark: #666666;

}


html,
body {

    margin: 0;

    padding: 0;

    background: #000000;

}


body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    color:
        var(--text);

}


.panel {

    width: 100%;

    max-width: 760px;

    margin: auto;

}


/* =========================
   ANA KART
========================= */

.card {

    position: relative;

    background:
        linear-gradient(
            145deg,
            #151515 0%,
            #101010 100%
        );

    border:
        1px solid #2d2d2d;

    border-radius:
        14px;

    padding:
        22px 22px 18px;

    overflow:
        hidden;

    min-height:
        220px;

    transition:
        opacity .25s ease,
        transform .25s ease,
        border-color .2s ease,
        box-shadow .2s ease;

}


.card:hover {

    border-color:
        var(--border-orange);

    box-shadow:
        0 0 0 1px
        rgba(255,122,0,0.04),

        0 8px 30px
        rgba(0,0,0,0.35);

}


.card::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    right: 0;

    height: 2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--orange),
            transparent
        );

    opacity: .8;

}


.card.fade {

    opacity: 0;

    transform:
        translateY(4px);

}


.top-line {

    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;

    margin-bottom: 10px;

}


.ders {

    display: inline-flex;

    align-items: center;

    background:
        rgba(255,122,0,0.08);

    border:
        1px solid
        rgba(255,122,0,0.28);

    border-radius: 7px;

    padding:
        5px 9px;

    font-size: 12px;

    color:
        var(--orange-light);

    font-weight: 500;

}


.sayac {

    font-size: 12px;

    color: #9a9a9a;

    white-space: nowrap;

    min-width: 35px;

    text-align: right;

    font-variant-numeric:
        tabular-nums;

}


.baslik {

    font-size: 23px;

    font-weight: 650;

    line-height: 1.3;

    margin:
        8px 0 10px;

    color: #f4f4f4;

    word-break: break-word;

}


.konu {

    font-size: 12px;

    color:
        var(--orange-light);

    margin-bottom: 12px;

    opacity: .85;

}


.aciklama {

    font-size: 15px;

    line-height: 1.65;

    color:
        var(--text-soft);

    white-space:
        pre-wrap;

    word-break:
        break-word;

}


/* =========================
   SÜRE BAR
========================= */

.progress-wrap {

    margin-top: 18px;

    height: 4px;

    background: #242424;

    border-radius:
        999px;

    overflow: hidden;

}


.progress {

    height: 100%;

    width: 0%;

    background:
        linear-gradient(
            90deg,
            var(--orange-dark),
            var(--orange),
            var(--orange-light)
        );

    border-radius:
        inherit;

    transform-origin:
        left center;

    will-change:
        width;

    box-shadow:
        0 0 8px
        rgba(255,122,0,0.25);

}


/* =========================
   BUTONLAR
========================= */

.buttons {

    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 13px;

}


button {

    border:
        1px solid #383838;

    background:
        #181818;

    color:
        #dcdcdc;

    border-radius:
        8px;

    padding:
        8px 11px;

    font-size:
        13px;

    cursor:
        pointer;

    transition:
        background .15s ease,
        border-color .15s ease,
        color .15s ease,
        transform .1s ease,
        box-shadow .15s ease;

}


button:hover {

    background:
        rgba(255,122,0,0.09);

    border-color:
        rgba(255,122,0,0.45);

    color:
        #ffffff;

    box-shadow:
        0 0 0 1px
        rgba(255,122,0,0.04);

}


button:active {

    transform:
        scale(.98);

}


button.danger {

    border-color:
        rgba(220,70,50,0.28);

}


button.danger:hover {

    background:
        rgba(220,70,50,0.10);

    border-color:
        rgba(220,70,50,0.5);

}


/* =========================
   AYARLAR
========================= */

.settings {

    display: none;

    margin-top: 12px;

    background:
        linear-gradient(
            145deg,
            #0f0f0f,
            #090909
        );

    border:
        1px solid #292929;

    border-radius:
        14px;

    padding:
        17px;

}


.settings.open {

    display: block;

}


.settings-title {

    font-size: 15px;

    font-weight: 650;

    color: #f2f2f2;

    margin-bottom: 14px;

}


/* =========================
   SEÇİLİ NOT
========================= */

.selected-settings {

    background: #151515;

    border:
        1px solid
        rgba(255,122,0,0.22);

    border-radius:
        11px;

    padding: 14px;

    margin-bottom: 15px;

    box-shadow:
        inset 0 1px 0
        rgba(255,255,255,0.015);

}


.selected-label {

    font-size: 10px;

    color:
        var(--orange);

    margin-bottom: 6px;

    text-transform:
        uppercase;

    letter-spacing:
        .5px;

    font-weight: 600;

}


.selected-title {

    font-size: 18px;

    font-weight: 650;

    color: #f4f4f4;

    margin-bottom: 12px;

    word-break:
        break-word;

}


.setting-grid {

    display: grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap: 8px;

}


.setting-item {

    background: #101010;

    border:
        1px solid #272727;

    border-radius: 8px;

    padding: 10px;

    min-height: 58px;

}


.setting-item.full {

    grid-column:
        1 / -1;

}


.setting-item .label {

    display: block;

    font-size: 10px;

    color: #747474;

    margin-bottom: 5px;

}


.setting-item .value {

    font-size: 12px;

    color: #d3d3d3;

    word-break: break-word;

    line-height: 1.45;

}


.setting-item .value.orange {

    color:
        var(--orange-light);

}


.setting-actions {

    display: flex;

    gap: 8px;

    margin-top: 12px;

    flex-wrap: wrap;

}


/* =========================
   DİĞER KAYITLAR
========================= */

.all-title {

    font-size: 12px;

    color: #a3a3a3;

    margin:
        17px 0 8px;

    display: flex;

    align-items: center;

    gap: 7px;

}


.all-title::before {

    content: "";

    display: block;

    width: 3px;

    height: 13px;

    border-radius: 99px;

    background:

}


.note-list {

    display: flex;

    flex-direction: column;

    gap: 6px;

    max-height: 320px;

    overflow-y: auto;

    padding-right: 2px;

}


.note-list::-webkit-scrollbar {

}


.note-list::-webkit-scrollbar-track {

}


.note-list::-webkit-scrollbar-thumb {

    background: #343434;

    border-radius: 10px;

}


.note-list::-webkit-scrollbar-thumb:hover {

    background: #4a4a4a;

}


.note-item {

    display: flex;

    align-items: center;

    gap: 10px;

    background: #141414;

    border:
        1px solid #282828;

    border-radius:
        9px;

    padding:
        10px;

    cursor:
        pointer;

    transition:
        background .15s ease,
        border-color .15s ease,
        transform .1s ease;

}


.note-item:hover {

    background: #181818;

    border-color:
        rgba(255,122,0,0.25);

}


.note-item:active {

    transform:
        scale(.995);

}


.note-item.selected {

    border-color:
        rgba(255,122,0,0.55);

    background:
        rgba(255,122,0,0.055);

    box-shadow:
        inset 3px 0 0

}


.note-item-title {

    font-size: 12px;

    color: #e0e0e0;

    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;

}


.note-meta {

    display: flex;

    flex-wrap: wrap;

    gap: 7px;

    margin-top: 5px;

    font-size: 10px;

    color: #777;

    line-height: 1.4;

}


.meta-orange {

    color:
        #b8681f;

}


.active-status {

    color:
        #75a957;

}


.passive-status {

    color:
        #777;

}


/* =========================
   FORM
========================= */

.form {

    display: none;

    margin-top: 12px;

    background:
        linear-gradient(
            145deg,
            #101010,
            #090909
        );

    border:
        1px solid #292929;

    border-radius:
        14px;

    padding:
        17px;

}


.form.open {

    display: block;

}


.form-title {

    font-size: 15px;

    font-weight: 650;

    margin-bottom: 14px;

    color:
        #f0f0f0;

}


.field {

    margin-bottom: 11px;

}


.field label {

    display: block;

    font-size: 11px;

    color: #999;

    margin-bottom: 5px;

}


input,
textarea,
select {

    width: 100%;

    border:
        1px solid #303030;

    background:
        #161616;

    color:
        #dddddd;

    border-radius:
        8px;

    padding:
        9px 10px;

    font-family:
        inherit;

    font-size:
        13px;

    outline:
        none;

    transition:
        border-color .15s ease,
        box-shadow .15s ease;

}


input:focus,
textarea:focus,
select:focus {

    border-color:
        rgba(255,122,0,0.55);

    box-shadow:
        0 0 0 2px
        rgba(255,122,0,0.07);

}


textarea {

    min-height:
        100px;

    resize:
        vertical;

}


.form-buttons {

    display: flex;

    gap: 8px;

    margin-top: 13px;

}


.status {

    font-size: 12px;

    color: #999;

    margin-top: 9px;

    min-height: 17px;

}


/* =========================
   MOBİL
========================= */

@media (max-width: 520px) {

    .card {

        padding:
            17px;

    }


    .baslik {

        font-size:
            20px;

    }


    .setting-grid {

        grid-template-columns:
            1fr;

    }


    .setting-item.full {

        grid-column:
            auto;

    }

}

</style>
</head>

<script>


/* =========================
   API
========================= */

const API =
    "https://yks-bilgi-api.yanhesap100yh.workers.dev";


/* =========================
   VERİ
========================= */

let bilgiler = [];

let ayarBilgileri = [];

let seciliIndex = -1;

let seciliNot = null;


/* =========================
   TIMER
========================= */

const SURE = 10;

let kalanSure = SURE;

let timer = null;

let sonZaman = null;


/* =========================
   PAUSE
========================= */

let mousePause = false;

let settingsPause = false;

let formPause = false;


/* =========================
   FORM
========================= */

let duzenlemeModu = false;


/* =========================
   ELEMENTLER
========================= */

const card =
    document.getElementById(
        "card"
    );


const ders =
    document.getElementById(
        "ders"
    );


const baslik =
    document.getElementById(
        "baslik"
    );


const konu =
    document.getElementById(
        "konu"
    );


const aciklama =
    document.getElementById(
        "aciklama"
    );


const sayac =
    document.getElementById(
        "sayac"
    );


const progress =
    document.getElementById(
        "progress"
    );


const settings =
    document.getElementById(
        "settings"
    );


const form =
    document.getElementById(
        "form"
    );


/* =========================
   TARİH
========================= */

function tarihFormatla(
    tarih
) {

    if (!tarih) {
        return "-";
    }


    const date =
        new Date(
            tarih
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "-";
    }


    return date.toLocaleString(
        "tr-TR",
        {
            day:
                "2-digit",

            month:
                "2-digit",

            year:
                "numeric",

            hour:
                "2-digit",

            minute:
                "2-digit"
        }
    );

}


/* =========================
   AKTİF VERİLER
========================= */

async function verileriGetir() {

    try {

        const response =
            await fetch(
                API +
                "/ozetler"
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Veriler alınamadı."
            );

        }


        bilgiler =
            data.items ||
            [];


        if (
            !bilgiler.length
        ) {

            cancelAnimationFrame(
                timer
            );


            baslik.textContent =
                "Henüz aktif bilgi yok.";


            ders.textContent =
                "Bilgi";


            konu.textContent =
                "";


            aciklama.textContent =
                "";


            sayac.textContent =
                "";


            progress.style.width =
                "0%";


            return;

        }


        rastgeleNotGoster();


    }
    catch (error) {

        console.error(
            error
        );


        baslik.textContent =
            "Bilgiler yüklenemedi.";


        aciklama.textContent =
            "API bağlantısını kontrol edin.";

    }

}


/* =========================
   TÜM NOTLAR
========================= */

async function tumNotlariGetir() {

    try {

        const response =
            await fetch(
                API +
                "/ozetler-tumu"
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Kayıtlar alınamadı."
            );

        }


        ayarBilgileri =
            data.items ||
            [];


        ayarlarListesiniOlustur();

    }
    catch (error) {

        console.error(
            error
        );


        document.getElementById(
            "noteList"
        ).innerHTML = `

            <div style="
                color:#777;
                font-size:12px;
                padding:10px 0;
            ">

                Kayıtlar alınamadı.

            </div>

        `;

    }

}


/* =========================
   RASTGELE NOT
========================= */

function rastgeleNotGoster() {

    if (
        !bilgiler.length
    ) {
        return;
    }


    let yeniIndex;


    do {

        yeniIndex =
            Math.floor(
                Math.random() *
                bilgiler.length
            );

    }
    while (
        bilgiler.length > 1 &&
        yeniIndex === seciliIndex
    );


    seciliIndex =
        yeniIndex;


    seciliNot =
        bilgiler[
            seciliIndex
        ];


    kartGoster(
        seciliNot
    );


    timerBaslat();

}


/* =========================
   KART GÖSTER
========================= */

function kartGoster(
    item
) {

    card.classList.add(
        "fade"
    );


    setTimeout(() => {

        ders.textContent =
            item.ders ||
            "Bilgi";


        baslik.textContent =
            item.baslik ||
            "";


        konu.textContent =
            item.konu
                ? "Konu: " +
                  item.konu
                : "";


        aciklama.textContent =
            item.aciklama ||
            "";


        sayac.textContent =
            SURE +
            " sn";


        progress.style.width =
            "0%";


        card.classList.remove(
            "fade"
        );


    }, 220);


    /*
       Kart gerçekten yeni bilgi
       olarak seçildiği anda
       gösterim kaydı oluştur.
    */

    gosterimiKaydet(
        item
    );

}


/* =========================
   GÖSTERİM SAYACI
========================= */

async function gosterimiKaydet(
    item
) {

    if (!item || !item.id) {
        return;
    }


    /*
       Daha önce bu bilgi
       bu tarayıcıda ne zaman
       gösterilmişti?
    */

    let previousShowTime = null;


    try {

        previousShowTime =
            localStorage.getItem(
                "yks-bilgi-son-gosterim-" +
                item.id
            );

    }
    catch {

        previousShowTime =
            null;

    }


    /*
       Bu gösterimin zamanı.
    */

    const currentShowTime =
        new Date().toISOString();


    try {

        const response =
            await fetch(
                API +
                "/ozet-goster/" +
                encodeURIComponent(
                    item.id
                ),
                {
                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            previousShowTime:
                                previousShowTime

                        })
                }
            );


        const data =
            await response.json();


        if (
            data.success &&
            data.item
        ) {

            /*
               Hem ana listedeki
               hem de ayarlar listesindeki
               nesneyi güncelle.
            */

            const ana =
                bilgiler.find(
                    x =>
                        x.id ===
                        item.id
                );


            if (ana) {

                Object.assign(
                    ana,
                    data.item
                );

            }


            const ayar =
                ayarBilgileri.find(
                    x =>
                        x.id ===
                        item.id
                );


            if (ayar) {

                Object.assign(
                    ayar,
                    data.item
                );

            }


            if (
                seciliNot &&
                seciliNot.id ===
                item.id
            ) {

                Object.assign(
                    seciliNot,
                    data.item
                );


                /*
                   Ayarlar açıksa
                   değerleri hemen güncelle.
                */

                if (
                    settings.classList.contains(
                        "open"
                    )
                ) {

                    seciliNotuGoster();


                    ayarlarListesiniOlustur();

                }

            }

        }


        /*
           Bu gösterimi artık
           bir sonraki gösterimin
           "önceki gösterimi"
           olarak sakla.
        */

        try {

            localStorage.setItem(
                "yks-bilgi-son-gosterim-" +
                item.id,

                currentShowTime
            );

        }
        catch {

            /* localStorage kapalıysa
               sistem yine çalışmaya devam eder. */

        }


    }
    catch (error) {

        console.error(
            "Gösterim kaydı hatası:",
            error
        );

    }

}


/* =========================
   AKICI TIMER
========================= */

function timerBaslat() {

    cancelAnimationFrame(
        timer
    );


    kalanSure =
        SURE;


    sonZaman =
        performance.now();


    progress.style.width =
        "0%";


    sayac.textContent =
        SURE +
        " sn";


    timer =
        requestAnimationFrame(
            timerDongusu
        );

}


function timerDongusu(
    zaman
) {

    const duraklatildi =
        mousePause ||
        settingsPause ||
        formPause;


    if (
        !duraklatildi
    ) {

        const delta =
            (
                zaman -
                sonZaman
            ) / 1000;


        kalanSure -=
            delta;


        if (
            kalanSure < 0
        ) {

            kalanSure =
                0;

        }


        const yuzde =
            (
                (SURE - kalanSure) /
                SURE
            ) * 100;


        progress.style.width =
            yuzde +
            "%";


        sayac.textContent =
            Math.ceil(
                kalanSure
            ) +
            " sn";

    }


    /*
       Pause sırasında geçen süre
       sayaçtan düşmez.
    */

    sonZaman =
        zaman;


    if (
        kalanSure <= 0
    ) {

        rastgeleNotGoster();

        return;

    }


    timer =
        requestAnimationFrame(
            timerDongusu
        );

}

        document.getElementById(

        );


    const selectedUrl =
        document.getElementById(
            "selectedUrl"
        );


    const selectedAktif =
        document.getElementById(
            "selectedAktif"
        );


    const selectedEklenme =
        document.getElementById(
            "selectedEklenme"
        );


    const selectedSonGosterim =
        document.getElementById(
            "selectedSonGosterim"
        );


    const selectedGosterim =

            "selectedGosterim"
        );


    if (!seciliNot) {

        selectedDers.textContent =
            "-";

        selectedKonu.textContent =
            "-";

            "-";

        selectedEklenme.textContent =

        selectedSonGosterim.textContent =
            "-";

        selectedGosterim.textContent =
            "0";

        return;

    }


    title.textContent =
        seciliNot.baslik ||
        "-";


    selectedDers.textContent =
        seciliNot.ders ||
        "-";


    selectedKonu.textContent =
        seciliNot.konu ||
        "-";


    selectedAciklama.textContent =
        seciliNot.aciklama ||
        "-";


    selectedUrl.textContent =
        seciliNot.notionUrl
            ? "Bağlantı mevcut"
            : "Belirli değil";


    selectedAktif.textContent =
        seciliNot.aktif
            ? "● Aktif"
            : "○ Pasif";


    selectedAktif.className =
        seciliNot.aktif
            ? "value active-status"
            : "value passive-status";


    selectedEklenme.textContent =
        tarihFormatla(
            seciliNot.eklenmeTarihi
        );


    selectedSonGosterim.textContent =
        tarihFormatla(
            seciliNot.sonGosterim
        );


    selectedGosterim.textContent =

/* =========================
   DİĞER KAYITLAR
========================= */

function ayarlarListesiniOlustur() {

    const list =
        document.getElementById(
            "noteList"
        );


    if (
        !ayarBilgileri.length
    ) {

        list.innerHTML = `

            <div style="
                color:#777;
                font-size:12px;
                padding:10px 0;
            ">

                Henüz kayıt bulunmuyor.

            </div>

        `;

        return;

    }


    list.innerHTML =
        ayarBilgileri
            .map(item => {

                const selected =
                    seciliNot &&
                    item.id ===
                    seciliNot.id
                        ? "selected"
                        : "";


                const tarih =
                    tarihFormatla(
                        item.eklenmeTarihi
                    );


                const sonGosterim =
                    tarihFormatla(
                        item.sonGosterim
                    );


                return `

                    <div
                        class="note-item ${selected}"
                        onclick="ayarNotuSec('${item.id}')"
                    >

                        <div
                            style="
                                flex:1;
                                min-width:0;
                            "
                        >

                            <div
                                class="note-item-title"
                            >

                                ${escapeHtml(
                                    item.baslik ||
                                    "Başlıksız"
                                )}

                            </div>


                            <div
                                class="note-meta"
                            >

                                <span>
                                    ${escapeHtml(
                                        item.ders ||
                                        "-"
                                    )}
                                </span>


                                <span
                                    class="meta-orange"
                                >
                                    ${escapeHtml(
                                        item.konu ||
                                        "Konu yok"
                                    )}
                                </span>


                                <span>
                                    📅 Eklendi:
                                    ${tarih}
                                </span>


                                <span>
                                    👁 Gösterim:
                                    ${
                                        item.gosterimSayisi ||
                                        0
                                    }
                                </span>


                                <span>
                                    🕒 Son:
                                    ${sonGosterim}
                                </span>


                                <span
                                    class="${
                                        item.aktif
                                            ? "active-status"
                                            : "passive-status"
                                    }"
                                >

                                    ${
                                        item.aktif
                                            ? "● Aktif"
                                            : "○ Pasif"
                                    }

                                </span>


                            </div>


                        </div>


                    </div>

                `;

            })
            .join("");

}


/* =========================
   AYARLARDAN NOT SEÇ
========================= */

function ayarNotuSec(
    id
) {

    const bulunan =
        ayarBilgileri.find(
            item =>
                item.id === id
        );


    if (!bulunan) {
        return;
    }


    seciliNot =
        bulunan;


    seciliNotuGoster();


    ayarlarListesiniOlustur();

}


/* =========================
   NOT DÜZENLE
========================= */

function seciliNotuDuzenle() {

    if (!seciliNot) {

        alert(
            "Önce bir not seç."
        );

        return;

    }


    duzenlemeModu =
        true;


    formuDoldur(
        seciliNot
    );


    form.classList.add(
        "open"
    );


    formPause =

}


/* =========================
   FORM DOLDUR
========================= */

) {

        "formTitle"
    ).textContent =

    document.getElementById(
        "dersInput"

    document.getElementById(
        "konuInput"
    ).value =
        item.konu ||
        "";


    document.getElementById(
        "baslikInput"
    ).value =
        item.baslik ||
        "";


    document.getElementById(
        "aciklamaInput"
    ).value =
        item.aciklama ||
        "";


    document.getElementById(
        "konuSayfasiInput"
    ).value =
        item.notionUrl
            ? "current"
            : "";

}


/* =========================
   NOT SİL
========================= */

async function seciliNotuSil() {

    if (!seciliNot) {

        alert(
            "Önce bir not seç."
        );

        return;

    }


    const onay =
        confirm(
            `"${seciliNot.baslik}" notunu silmek istediğine emin misin?`
        );


    if (!onay) {
        return;
    }


    try {

        const response =
            await fetch(
                API +
                "/ozet-sil/" +
                encodeURIComponent(
                    seciliNot.id
                ),
                {
                    method:
                        "DELETE"
                }
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "Not silinemedi."
            );

        }


        const silinenId =
            seciliNot.id;


        bilgiler =
            bilgiler.filter(
                item =>
                    item.id !==
                    silinenId
            );


        ayarBilgileri =
            ayarBilgileri.filter(
                item =>
                    item.id !==
                    silinenId
            );


        try {

            localStorage.removeItem(
                "yks-bilgi-son-gosterim-" +
                silinenId
            );

        }
        catch {}


        seciliNot =
            null;


        if (
            bilgiler.length
        ) {

            seciliIndex =
                -1;


            rastgeleNotGoster();

        }
        else {

            cancelAnimationFrame(
                timer
            );


            baslik.textContent =
                "Henüz aktif bilgi yok.";


            ders.textContent =
                "Bilgi";


            konu.textContent =
                "";


            aciklama.textContent =
                "";


            sayac.textContent =
                "";


            progress.style.width =
                "0%";

        }


        seciliNot =
            bilgiler[
                seciliIndex
            ] ||
            null;


        seciliNotuGoster();


        ayarlarListesiniOlustur();


    }
    catch (error) {

        console.error(
            error
        );


        alert(
            "Not silinemedi: " +
            error.message
        );

    }

}

   BİLGİ EKLE

}

    ).value =
        "";

        "konuInput"
    ).value =
        "";


    document.getElementById(

    ).value =
        "";


    document.getElementById(

    ).value =
        "";


    document.getElementById(

    ).value =
        "";


    document.getElementById(

    ).textContent =
        "";

}


/* =========================
   FORM KAYDET
========================= */

async function formuKaydet() {

    const dersValue =
        document.getElementById(
            "dersInput"
        ).value;


    const konuValue =
        document.getElementById(
            "konuInput"
        ).value;


    const baslikValue =
        document.getElementById(
            "baslikInput"
        ).value;


    const aciklamaValue =
        document.getElementById(
            "aciklamaInput"
        ).value;


    if (
        !dersValue ||
        !baslikValue ||
        !aciklamaValue
    ) {

        alert(
            "Ders, Başlık ve Açıklama zorunludur."
        );

        return;

    }


    const notionUrl =
        konuSayfasiUrlAl();


    const payload = {

        baslik:
            baslikValue,

        ders:
            dersValue,

        konu:
            konuValue,

        aciklama:
            aciklamaValue,

        notionUrl:
            notionUrl

    };


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "Kaydediliyor...";


    try {

        let response;


        if (
            duzenlemeModu
        ) {

            response =
                await fetch(
                    API +
                    "/ozet-duzenle/" +
                    encodeURIComponent(
                        seciliNot.id
                    ),
                    {
                        method:
                            "PATCH",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );

        }
        else {

            response =
                await fetch(
                    API +
                    "/ozet-ekle",
                    {
                        method:
                            "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify(
                                payload
                            )
                    }
                );

        }


        const data =
            await response.json();


        if (
            !data.success
        ) {

            throw new Error(
                data.error ||
                "İşlem başarısız."
            );

        }


        status.textContent =
            "✓ Kaydedildi.";


        if (
            duzenlemeModu &&
            data.item
        ) {

            Object.assign(
                seciliNot,
                data.item
            );

        }


        formuKapat();


        await verileriGetir();


        if (
            settings.classList.contains(
                "open"
            )
        ) {

            await tumNotlariGetir();

            /*
               verileriGetir() yeni
               seciliNot oluşturduğu için
               tekrar detay göster.
            */

            seciliNot =
                bilgiler[
                    seciliIndex
                ] ||
                seciliNot;


            seciliNotuGoster();

        }


    }
    catch (error) {

        console.error(
            error
        );


        status.textContent =
            "Hata: " +
            error.message;

    }

}


/* =========================
   KONU SAYFASI URL
========================= */

function konuSayfasiUrlAl() {

    const secim =
        document.getElementById(
            "konuSayfasiInput"
        ).value;


    if (
        secim !== "current"
    ) {

        /*
           Düzenleme sırasında
           None seçilirse URL temizlenir.
        */

        return "";

    }


    /*
       Düzenleme sırasında
       mevcut URL'yi koru.
    */

    if (
        duzenlemeModu &&
        seciliNot &&
        seciliNot.notionUrl
    ) {

        return seciliNot.notionUrl;

    }


    /*
       Notion embed referrer.
    */

    const referrer =
        document.referrer;


    if (
        referrer &&
        referrer.includes(
            "notion"
        )
    ) {

        return referrer;

    }


    return "";

}


/* =========================
   KONUYA GİT
========================= */

function konuyaGit() {

    if (
        !seciliNot ||
        !seciliNot.notionUrl
    ) {

        alert(
            "Konu belirli değil."
        );

        return;

    }


    window.open(
        seciliNot.notionUrl,
        "_blank"
    );

}


/* =========================
   YAPAY ZEKA
========================= */

function yapayZeka() {

    if (!seciliNot) {
        return;
    }


    const prompt =
        `Bu bilgi hakkında bana yardımcı ol.

Başlık: ${
    seciliNot.baslik || ""
}

Ders: ${
    seciliNot.ders || ""
}

Konu: ${
    seciliNot.konu || ""
}

Açıklama: ${
    seciliNot.aciklama || ""
}

Bana bu bilgiyi YKS seviyesinde açıkla ve gerekirse beni test et.`;


    window.open(
        "https://chatgpt.com/?q=" +
        encodeURIComponent(
            prompt
        ),
        "_blank"
    );

}


/* =========================
   ESC
========================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key !== "Escape"
        ) {
            return;
        }


        if (
            form.classList.contains(
                "open"
            )
        ) {

            formuKapat();

        }


        if (
            settings.classList.contains(
                "open"
            )
        ) {

            ayarlariKapat();

        }

    }
);


/* =========================
   HTML GÜVENLİĞİ
========================= */

function escapeHtml(
    value
) {

    return String(
        value
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================
   BAŞLAT
========================= */

verileriGetir();

</script>
