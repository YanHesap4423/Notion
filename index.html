<!DOCTYPE html>
<html lang="tr">

<head>

    name="viewport"

<title>Bugünün Bilgisi</title>


<style>

/* =========================================================
   TEMEL
========================================================= */

* {
    box-sizing: border-box;
}

:root {

    /* NOTION DARK DIŞ ARKA PLAN */
    --notion-bg: #191919;

    /* KART ESKİ SİYAH */
    --card: #121212;
    --card-dark: #101010;

    /* TURUNCU */
    --orange: #ff7a00;
    --orange-light: #ff922b;
    --orange-dark: #c75d00;

    /* SINIRLAR */
    --border: #303030;

    /* METİNLER */
    --text: #f2f2f2;
    --text-soft: #cfcfcf;
    --text-muted: #888888;

}


/* =========================================================
   BODY
========================================================= */

html,
body {

    margin:
        0;

    padding:
        0;

    background:
        var(--notion-bg);

}


body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    color:
        var(--text);

}


/* =========================================================
   PANEL
========================================================= */

.panel {

    width:
        100%;

    max-width:
        760px;

    margin:
        auto;

    position:
        relative;

}


/* =========================================================
   KART
========================================================= */

.card {

    position:
        relative;

    background:
        linear-gradient(
            145deg,
            #151515,
            #101010
        );

    border:
        1px solid #303030;

    border-radius:
        14px;

    padding:
        22px 22px 18px;

    overflow:
        hidden;

    min-height:
        220px;

    transition:
        opacity .25s ease,
        transform .25s ease,
        border-color .2s ease,
        box-shadow .2s ease;

}


.card:hover {

    border-color:
        rgba(255,122,0,.42);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);

}


.card::before {

    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        0;

    right:
        0;

    height:
        2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--orange),
            transparent
        );

    opacity:
        .85;

}


.card.fade {

    opacity:
        0;

    transform:
        translateY(4px);

}


/* =========================================================
   ÜST
========================================================= */

.top-line {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;

    margin-bottom:
        10px;

}


.ders {

    display:
        inline-flex;

    align-items:
        center;

    background:
        rgba(255,122,0,.08);

    border:
        1px solid
        rgba(255,122,0,.28);

    border-radius:
        7px;

    padding:
        5px 9px;

    font-size:
        12px;

    color:
        var(--orange-light);

    font-weight:
        500;

}


.sayac {

    font-size:
        12px;

    color:
        #909090;

    min-width:
        35px;

    text-align:
        right;

    white-space:
        nowrap;

    font-variant-numeric:
        tabular-nums;

}


/* =========================================================
   BAŞLIK
========================================================= */

.baslik {

    font-size:
        23px;

    font-weight:
        650;

    line-height:
        1.3;

    margin:
        8px 0 10px;

    color:
        #f3f3f3;

    word-break:
        break-word;

}


/* =========================================================
   KONU
========================================================= */

.konu {

    font-size:
        12px;

    color:
        var(--orange-light);

    margin-bottom:
        12px;

    opacity:
        .88;

}


/* =========================================================
   AÇIKLAMA
========================================================= */

.aciklama {

    font-size:
        15px;

    line-height:
        1.65;

    color:
        var(--text-soft);

    white-space:
        pre-wrap;

    word-break:
        break-word;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-wrap {

    margin-top:
        18px;

    height:
        4px;

    background:
        #292929;

    border-radius:
        999px;

    overflow:
        hidden;

}


.progress {

    height:
        100%;

    width:
        0%;

    background:
        linear-gradient(
            90deg,
            var(--orange-dark),
            var(--orange),
            var(--orange-light)
        );

    border-radius:
        inherit;

    transform-origin:
        left center;

    will-change:
        width;

    box-shadow:
        0 0 8px
        rgba(255,122,0,.20);

}


/* =========================================================
   BUTONLAR
========================================================= */

.buttons {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        8px;

    margin-top:
        13px;

}


button {

    border:
        1px solid #393939;

    background:
        #181818;

    color:
        #dcdcdc;

    border-radius:
        8px;

    padding:
        8px 11px;

    font-size:
        13px;

    cursor:
        pointer;

    transition:
        background .15s ease,
        border-color .15s ease,
        color .15s ease,
        transform .1s ease,
        box-shadow .15s ease;

}


button:hover {

    background:
        rgba(255,122,0,.09);

    border-color:
        rgba(255,122,0,.48);

    color:
        #ffffff;

}


button:active {

    transform:
        scale(.98);

}


button.danger {

    border-color:
        rgba(220,70,50,.30);

}


button.danger:hover {

    background:
        rgba(220,70,50,.10);

    border-color:
        rgba(220,70,50,.52);

}


/* =========================================================
   TOAST
========================================================= */

.toast {

    position:
        fixed;

    left:
        50%;

    bottom:
        24px;

    transform:
        translateX(-50%)
        translateY(15px);

    background:
        #242424;

    border:
        1px solid
        rgba(255,122,0,.40);

    color:
        #eeeeee;

    padding:
        10px 14px;

    border-radius:
        9px;

    font-size:
        12px;

    opacity:
        0;

    pointer-events:
        none;

    transition:
        opacity .2s ease,
        transform .2s ease;

    z-index:
        9999;

}


.toast.show {

    opacity:
        1;

    transform:
        translateX(-50%)
        translateY(0);

}


/* =========================================================
   AYARLAR
========================================================= */

.settings {

    display:
        none;

    margin-top:
        12px;

    background:
        #101010;

    border:
        1px solid #2d2d2d;

    border-radius:
        14px;

    padding:
        17px;

}


.settings.open {

    display:
        block;

}


.settings-title {

    font-size:
        15px;

    font-weight:
        650;

    color:
        #f2f2f2;

    margin-bottom:
        14px;

}


/* =========================================================
   SEÇİLİ NOT
========================================================= */

.selected-settings {

    background:
        #151515;

    border:
        1px solid
        rgba(255,122,0,.23);

    border-radius:
        11px;

    padding:
        14px;

    margin-bottom:
        15px;

}


.selected-label {

    font-size:
        10px;

    color:
        var(--orange);

    margin-bottom:
        6px;

    text-transform:
        uppercase;

    letter-spacing:
        .5px;

    font-weight:
        600;

}


.selected-title {

    font-size:
        18px;

    font-weight:
        650;

    color:
        #f4f4f4;

    margin-bottom:
        12px;

    word-break:
        break-word;

}


/* =========================================================
   AYAR GRID
========================================================= */

.setting-grid {

    display:
        grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0, 1fr)
        );

    gap:
        8px;

}


.setting-item {

    background:
        #101010;

    border:
        1px solid #292929;

    border-radius:
        8px;

    padding:
        10px;

    min-height:
        58px;

}


.setting-item.full {

    grid-column:
        1 / -1;

}


.setting-item .label {

    display:
        block;

    font-size:
        10px;

    color:
        #747474;

    margin-bottom:
        5px;

}


.setting-item .value {

    font-size:
        12px;

    color:
        #d2d2d2;

    word-break:
        break-word;

    line-height:
        1.45;

}


.setting-item .value.orange {

    color:
        var(--orange-light);

}


.setting-actions {

    display:
        flex;

    gap:
        8px;

    margin-top:
        12px;

    flex-wrap:
        wrap;

}


/* =========================================================
   DİĞER KAYITLAR
========================================================= */

.all-title {

        12px;

    color:
        #a2a2a2;

    margin:

    display:
        flex;

    align-items:
        center;

    gap:
        7px;

}


.all-title::before {

    content:
        "";

    width:
        3px;

    height:
        13px;

    border-radius:
        99px;

    background:
        var(--orange);

}


.note-list {

    display:
        flex;

    flex-direction:
        column;

    gap:
        6px;

    max-height:
        320px;

    overflow-y:
        auto;

    padding-right:
        2px;

}


.note-list::-webkit-scrollbar {

    width:
        5px;

}


.note-list::-webkit-scrollbar-track {

    background:
        #0d0d0d;

}


.note-list::-webkit-scrollbar-thumb {

    background:
        #333333;

    border-radius:
        10px;

}


.note-list::-webkit-scrollbar-thumb:hover {

    background:
        #444444;

}


.note-item {

    display:
        flex;

    align-items:
        center;

    gap:
        10px;

    background:
        #151515;

    border:
        1px solid #292929;

    border-radius:
        9px;

    padding:
        10px;

    cursor:
        pointer;

    transition:
        background .15s ease,
        border-color .15s ease,
        transform .1s ease;

}


.note-item:hover {

    background:
        #1a1a1a;

    border-color:
        rgba(255,122,0,.30);

}


.note-item:active {

    transform:
        scale(.995);

}


.note-item.selected {

    border-color:
        rgba(255,122,0,.60);

    background:
        rgba(255,122,0,.055);

    box-shadow:
        inset 3px 0 0
        var(--orange);

}


.note-item-title {

    font-size:
        12px;

    color:
        #e1e1e1;

    overflow:
        hidden;

    text-overflow:
        ellipsis;

    white-space:
        nowrap;

}


.note-meta {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        7px;

    margin-top:
        5px;

    font-size:
        10px;

    color:
        #777777;

    line-height:
        1.4;

}


.meta-orange {

    color:
        #c47127;

}


.active-status {

    color:
        #77ad58;

}


.passive-status {

    color:
        #767676;

}


/* =========================================================
   FORM
========================================================= */

.form {

    display:
        none;

    margin-top:
        12px;

    background:
        #101010;

    border:
        1px solid #2d2d2d;

    border-radius:
        14px;

    padding:
        17px;

}


.form.open {

    display:
        block;

}


.form-title {

    font-size:
        15px;

    font-weight:
        650;

    margin-bottom:
        14px;

}


.field {

    margin-bottom:
        11px;

}


.field label {

    display:
        block;

    font-size:
        11px;

    color:
        #999999;

    margin-bottom:
        5px;

}


input,
textarea,
select {

    width:
        100%;

    border:
        1px solid #333333;

    background:
        #161616;

    color:
        #dddddd;

    border-radius:
        8px;

    padding:
        9px 10px;

    font-family:
        inherit;

    font-size:
        13px;

    outline:
        none;

    transition:
        border-color .15s ease,
        box-shadow .15s ease;

}


input:focus,
textarea:focus,
select:focus {

    border-color:
        rgba(255,122,0,.58);

    box-shadow:
        0 0 0 2px
        rgba(255,122,0,.06);

}


textarea {

    min-height:
        100px;

    resize:
        vertical;

}


.form-buttons {

    display:
        flex;

    gap:
        8px;

    margin-top:
        13px;

}


.status {

    font-size:
        12px;

    color:
        #999999;

    margin-top:
        9px;

    min-height:
        17px;

}


/* =========================================================
   MOBİL
========================================================= */

@media (max-width:520px) {

    .card {

        padding:
            17px;

    }


    .baslik {

        font-size:
            20px;

    }


    .setting-grid {

        grid-template-columns:
            1fr;

    }


    .setting-item.full {

        grid-column:
            auto;

    }


    .toast {

        max-width:
            calc(
                100vw - 30px
            );

        text-align:
            center;

        white-space:
            normal;

    }

}

</style>

</head>

/* =========================================================
   API
========================================================= */

const API =
    "https://yks-bilgi-api.yanhesap100yh.workers.dev";


/* =========================================================
   VERİLER
========================================================= */

let bilgiler = [];

let ayarBilgileri = [];

let seciliIndex = -1;

let seciliNot = null;


/* =========================================================
   TIMER
========================================================= */

const SURE =
    10;

let kalanSure =
    SURE;

let timer =
    null;

let sonZaman =
    null;


/* =========================================================
   PAUSE
========================================================= */

    false;

let settingsPause =
    false;

let formPause =
    false;


/* =========================================================
   FORM
========================================================= */

    false;


/* =========================================================
   ELEMENTLER
========================================================= */

const panel =
    document.getElementById(
        "panel"
    );


const card =
    document.getElementById(
        "card"
    );


const ders =
    document.getElementById(
        "ders"
    );


const baslik =
    document.getElementById(
        "baslik"
    );


const konu =
    document.getElementById(

const aciklama =

    );


const sayac =
    document.getElementById(

    );


const progress =
    document.getElementById(
        "progress"
    );


const settings =
    document.getElementById(
        "settings"
    );


const form =
    document.getElementById(
        "form"
    );


const toast =
    document.getElementById(
        "toast"
    );


/* =========================================================
   TOAST
========================================================= */

let toastTimer =
    null;


function toastGoster(
    mesaj
) {

    toast.textContent =
        mesaj;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"

            },

        );

}


/* =========================================================
   TARİH
========================================================= */

function tarihFormatla(
    tarih
) {

    if (!tarih) {

        return "-";

    }


    const date =
        new Date(
            tarih
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    return date.toLocaleString(
        "tr-TR",
        {

            day:
                "2-digit",

            month:
                "2-digit",

            year:
                "numeric",

            hour:
                "2-digit",

            minute:
                "2-digit"

        }
    );

}


/* =========================================================
   AKTİF VERİLER
========================================================= */

async function verileriGetir(
    ilkYukleme = false
) {

    try {

        const response =
            await fetch(
                API +
                "/ozetler"
            );


        const data =
            await response.json();


        if (
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Veriler alınamadı."
            );

        }


        bilgiler =
            data.items ||
            [];


        if (
            !bilgiler.length
        ) {

            cancelAnimationFrame(
                timer
            );


            baslik.textContent =
                "Henüz aktif bilgi yok.";


            ders.textContent =
                "Bilgi";


            konu.textContent =
                "";


            aciklama.textContent =
                "";


            sayac.textContent =
                "";


            progress.style.width =
                "0%";


            return;

        }


        /*
           İlk açılışta rastgele bilgi getir.

           Sonraki yenilemelerde mevcut
           kartı korumaya çalış.
        */

        if (
            ilkYukleme ||
            seciliNot === null
        ) {

            rastgeleNotGoster();

            return;

        }


        const ayniNot =
            bilgiler.find(
                item =>
                    item.id ===
                    seciliNot.id
            );


        if (ayniNot) {

            seciliNot =
                ayniNot;


            seciliIndex =
                bilgiler.findIndex(
                    item =>
                        item.id ===
                        ayniNot.id
                );

        }

    }
    catch (error) {

        console.error(
            error
        );


        baslik.textContent =
            "Bilgiler yüklenemedi.";


        aciklama.textContent =
            "API bağlantısını kontrol edin.";

    }

}

    try {

        const response =

        const data =
            await response.json();


        if (

        ) {

            throw new Error(

                "Kayıtlar alınamadı."
            );

        }


        ayarBilgileri =
            data.items ||
            [];


        /*
           Eğer seçili notun sunucuda
           güncellenmiş hali varsa onu kullan.
        */

        if (
            seciliNot
        ) {

            const guncel =
                ayarBilgileri.find(
                    item =>
                        item.id ===
                        seciliNot.id
                );


            if (guncel) {

                seciliNot =
                    guncel;

            }

        }


        seciliNotuGoster();


        ayarlarListesiniOlustur();

    }
    catch (error) {

        console.error(
            error
        );


        document.getElementById(
            "noteList"
        ).innerHTML = `

            ">

                Kayıtlar alınamadı.

            </div>

        `;

    }

}


/* =========================================================
   RASTGELE NOT
========================================================= */

function rastgeleNotGoster() {

    if (
        !bilgiler.length
    ) {

        return;

    }


    let yeniIndex;


    do {

        yeniIndex =
            Math.floor(
                Math.random() *
                bilgiler.length
            );

    }
    while (
        bilgiler.length > 1 &&
        yeniIndex === seciliIndex
    );


    seciliIndex =
        yeniIndex;


    seciliNot =
        bilgiler[
            seciliIndex
        ];


    kartGoster(
        seciliNot
    );


    timerBaslat();

}

/* =========================================================
   GÖSTERİM KAYDET
========================================================= */

/*
   Her not için son gösterimi client tarafında
   bir önceki gösterim olarak da tutuyoruz.

   Böylece Worker'a:

   oncekiGosterim

   gönderiyoruz.

   Notion ise kalıcı sayaç olarak görev yapıyor.
*/

const sonGosterimCache =
    {};


function gosterimiKaydet(
    item
) {

    if (
        !item ||
        !item.id
    ) {

        return;

    }


    const cacheKey =
        "yks-bilgi-son-gosterim-" +
        item.id;


    let oncekiGosterim =
        sonGosterimCache[
            item.id
        ] ||
        null;


    /*
       İlk olarak mevcut Notion değerini
       başlangıç değeri olarak kullan.
    */

    if (
        !oncekiGosterim &&
        item.sonGosterim
    ) {

        oncekiGosterim =
            item.sonGosterim;

    }


    /*
       Şimdiki gösterim zamanı.
       Bir sonraki gösterimde
       Son Gösterim olacak.
    */

    const simdikiGosterim =
        new Date().toISOString();


    fetch(
        API +
        "/ozet-goster/" +
        encodeURIComponent(
            item.id
        ),
        {

            method:
                "POST",

            headers: {

                "Content-Type":
                    "application/json"

            },

            body:
                JSON.stringify({

                    oncekiGosterim:
                        oncekiGosterim

                })

        }
    )
    .then(
        response =>
            response.json()
    )
    .then(
        data => {

            if (
                !data.success
            ) {

                console.error(
                    "Gösterim güncellenemedi:",
                    data
                );

                return;

            }


            /*
               Bu gösterimi gelecekteki
               "bir önceki gösterim"
               olarak cache'e yaz.
            */

            sonGosterimCache[
                item.id
            ] =
                simdikiGosterim;


            if (
                data.item
            ) {

                const ana =
                    bilgiler.find(
                        x =>
                            x.id ===
                            item.id
                    );


                if (ana) {

                    Object.assign(
                        ana,
                        data.item
                    );

                }


                const ayar =
                    ayarBilgileri.find(
                        x =>
                            x.id ===
                            item.id
                    );


                if (ayar) {

                    Object.assign(
                        ayar,
                        data.item
                    );

                }


                if (
                    seciliNot &&
                    seciliNot.id ===
                    item.id
                ) {

                    Object.assign(
                        seciliNot,
                        data.item
                    );


                    if (
                        settings.classList.contains(
                            "open"
                        )
                    ) {

                        seciliNotuGoster();

                        ayarlarListesiniOlustur();

                    }

                }

            }

        }
    )
    .catch(
        error => {

            console.error(
                "Gösterim kaydı hatası:",
                error
            );

        }
    );

}


/* =========================================================
   TIMER
========================================================= */

function timerBaslat() {

    cancelAnimationFrame(
        timer
    );


    kalanSure =
        SURE;


    sonZaman =
        performance.now();


    progress.style.width =
        "0%";


    sayac.textContent =
        SURE +
        " sn";


    timer =
        requestAnimationFrame(
            timerDongusu
        );

}


function timerDongusu(
    zaman
) {

    const duraklatildi =
        mousePause ||
        settingsPause ||
        formPause;


    if (
        !duraklatildi
    ) {

        const delta =
            (
                zaman -
                sonZaman
            ) / 1000;


        kalanSure -=
            delta;


        if (
            kalanSure < 0
        ) {

            kalanSure =
                0;

        }


        const yuzde =
            (
                (SURE - kalanSure) /
                SURE
            ) * 100;


        progress.style.width =
            yuzde +
            "%";


        sayac.textContent =
            Math.ceil(
                kalanSure
            ) +
            " sn";

    }


    sonZaman =
        zaman;


    if (
        kalanSure <= 0
    ) {

        rastgeleNotGoster();

        return;

    }


    timer =
        requestAnimationFrame(
            timerDongusu
        );

}

    if (!bulunan) {

        return;

    }


    seciliNot =

    const aktifIndex =
        bilgiler.findIndex(

        );


    /*
       Seçilen kayıt aktifse ana kart
       seçimini de onunla eşleştir.

       Pasifse mevcut kart değişmez.

    if (
        aktifIndex !== -1
    ) {

        seciliIndex =
            aktifIndex;

    }


    seciliNotuGoster();


    ayarlarListesiniOlustur();

}

/* =========================================================
   SİL
========================================================= */

async function seciliNotuSil() {

    if (!seciliNot) {

        alert(
            "Önce bir not seç."
        );

        return;

    }


    const silinenId =
        seciliNot.id;


    const silinenBaslik =
        seciliNot.baslik ||
        "Bu not";


    const onay =
        confirm(
            `"${silinenBaslik}" notunu silmek istediğine emin misin?`
        );


    if (!onay) {

        return;

    }


    try {

        const response =
            await fetch(
                API +
                "/ozet-sil/" +
                encodeURIComponent(
                    silinenId
                ),
                {
                    method:
                        "DELETE"
                }
            );


        const data =
            await response.json();


        if (
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Not silinemedi."
            );

        }


        /*
           Cache temizle.
        */

        delete sonGosterimCache[
            silinenId
        ];


        /*
           Listelerden çıkar.
        */

        bilgiler =
            bilgiler.filter(
                item =>
                    item.id !==
                    silinenId
            );


        ayarBilgileri =
            ayarBilgileri.filter(
                item =>
                    item.id !==
                    silinenId
            );


        /*
           Eğer silinen not ekrandaki
           aktif kart ise yeni kart getir.
        */

        const aktifKartSilindi =
            (
                seciliNot &&
                seciliNot.id ===
                silinenId
            );


        seciliNot =
            null;


        if (
            aktifKartSilindi
        ) {

            if (
                bilgiler.length
            ) {

                seciliIndex =
                    -1;


                rastgeleNotGoster();

            }
            else {

                cancelAnimationFrame(
                    timer
                );


                baslik.textContent =
                    "Henüz aktif bilgi yok.";


                ders.textContent =
                    "Bilgi";


                konu.textContent =
                    "";


                aciklama.textContent =
                    "";


                sayac.textContent =
                    "";


                progress.style.width =
                    "0%";

            }

        }


        /*
           Seçili not artık yoksa
           kalan aktif kartı seç.
        */

        if (
            !seciliNot &&
            bilgiler.length &&
            !aktifKartSilindi
        ) {

            seciliNot =
                bilgiler[
                    Math.max(
                        0,
                        seciliIndex
                    )
                ] ||
                bilgiler[0];

        }


        seciliNotuGoster();


        ayarlarListesiniOlustur();


        toastGoster(
            "✓ Not silindi."
        );


    }
    catch (error) {

        console.error(
            error
        );


        alert(
            "Not silinemedi: " +
            error.message
        );

    }

}

        document.getElementById(
            "dersInput"
        ).value;


    const konuValue =
        document.getElementById(
            "konuInput"
        ).value;


    const baslikValue =
        document.getElementById(
            "baslikInput"
        ).value;


    const aciklamaValue =
        document.getElementById(
            "aciklamaInput"
        ).value;


    if (
        !dersValue ||
        !baslikValue ||
        !aciklamaValue
    ) {

        alert(
            "Ders, Başlık ve Açıklama zorunludur."
        );

        return;

    }


    const notionUrl =
        konuSayfasiUrlAl();


    const payload = {

        baslik:
            baslikValue,

        ders:
            dersValue,

        konu:
            konuValue,

        aciklama:
            aciklamaValue,

        notionUrl:
            notionUrl

    };


    const status =
        document.getElementById(
            "status"
        );


    status.textContent =
        "Kaydediliyor...";


    try {

        let response;


        if (
            duzenlemeModu &&
            seciliNot
        ) {

            response =
                await fetch(
                    API +
                    "/ozet-duzenle/" +
                    encodeURIComponent(
                        seciliNot.id
                    ),
                    {

                        method:
                            "PATCH",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                payload
                            )

                    }
                );

        }
        else {

            response =
                await fetch(
                    API +
                    "/ozet-ekle",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                payload
                            )

                    }
                );

        }


        const data =
            await response.json();


        if (
            !data.success
        ) {

            throw new Error(
                data.error ||
                "İşlem başarısız."
            );

        }


        if (
            duzenlemeModu &&
            data.item
        ) {

            const id =
                data.item.id;


            const ana =
                bilgiler.find(
                    item =>
                        item.id ===
                        id
                );


            if (ana) {

                Object.assign(
                    ana,
                    data.item
                );

            }


            const ayar =
                ayarBilgileri.find(
                    item =>
                        item.id ===
                        id
                );


            if (ayar) {

                Object.assign(
                    ayar,
                    data.item
                );

            }


            seciliNot =
                data.item;


            /*
               Eğer düzenlenen kayıt aktifse
               ana kart da güncellenir.

               Timer sıfırlanmaz.
            */

            const aktifIndex =
                bilgiler.findIndex(
                    item =>
                        item.id ===
                        id
                );


            if (
                aktifIndex !== -1
            ) {

                seciliIndex =
                    aktifIndex;


                ders.textContent =
                    data.item.ders ||
                    "Bilgi";


                baslik.textContent =
                    data.item.baslik ||
                    "";


                konu.textContent =
                    data.item.konu
                        ? "Konu: " +
                          data.item.konu
                        : "";


                aciklama.textContent =
                    data.item.aciklama ||
                    "";

            }

        }
        else if (
            data.item
        ) {

            /*
               Yeni kayıt.
            */

            if (
                data.item.aktif
            ) {

                bilgiler.push(
                    data.item
                );

            }


            ayarBilgileri.push(
                data.item
            );

        }


        formuKapat();


        if (
            settings.classList.contains(
                "open"
            )
        ) {

            await tumNotlariGetir();

        }


        toastGoster(
            duzenlemeModu
                ? "✓ Not güncellendi."
                : "✓ Bilgi eklendi."
        );


    }
    catch (error) {

        console.error(
            error
        );


        status.textContent =
            "Hata: " +
            error.message;

    }

}


/* =========================================================
   KONU SAYFASI
========================================================= */

function konuSayfasiUrlAl() {

    const secim =
        document.getElementById(
            "konuSayfasiInput"
        ).value;


    if (
        secim !==
        "current"
    ) {

        return "";

    }


    /*
       Düzenleme sırasında mevcut
       URL korunur.
    */

    if (
        duzenlemeModu &&
        seciliNot &&
        seciliNot.notionUrl
    ) {

        return seciliNot.notionUrl;

    }


    const referrer =
        document.referrer;


    if (
        referrer &&
        referrer.includes(
            "notion"
        )
    ) {

        return referrer;

    }


    return "";

}


/* =========================================================
   KONUYA GİT
========================================================= */

function konuyaGit() {

    if (
        !seciliNot ||
        !seciliNot.notionUrl
    ) {

        alert(
            "Konu belirli değil."
        );

        return;

    }


    const win =
        window.open(

        );


    if (!win) {

            seciliNot.notionUrl;

    }

}


/* =========================================================
   YAPAY ZEKA
========================================================= */

async function yapayZeka() {

    if (!seciliNot) {

        alert(
            "Önce bir bilgi seçili olmalı."
        );

        return;

    }


    /*
       İçerikle birlikte
       YKS yönlendirmesi.
    */

    const prompt =
`Bu YKS bilgi kartındaki içerikle birlikte çalış.

Ders:
${seciliNot.ders || "-"}

Konu:
${seciliNot.konu || "-"}

Başlık:
${seciliNot.baslik || "-"}

İçerik:
${seciliNot.aciklama || "-"}


Görevin:

1. Önce verdiğim içeriği dikkatlice analiz et.
2. Konuyu YKS seviyesinde anlaşılır şekilde açıkla.
3. Kritik noktaları ve sınavda karıştırılabilecek ayrıntıları belirt.
4. Varsa istisnaları ayrıca göster.
5. İçerikte eksik veya hatalı bir nokta varsa belirt.
6. Sonrasında beni bu konu hakkında tek tek, zor ve ÖSYM tarzında sorularla test et.
7. Ben cevap vermeden doğru cevabı söyleme.
8. Gerektiğinde yanlış yaptığım noktayı açıklayıp tekrar soru sor.
9. Konuşmayı doğrudan bu bilgi kartındaki içerikten başlat.`;


    /*
       ChatGPT'yi aç.
    */

    const win =
        window.open(
            "https://chatgpt.com/",
            "_blank",
            "noopener,noreferrer"
        );


    /*
       Promptu panoya kopyala.
    */

    let copied =
        false;


    try {

        await navigator.clipboard.writeText(
            prompt
        );


        copied =
            true;

    }
    catch {

        try {

            const textarea =
                document.createElement(
                    "textarea"
                );


            textarea.value =
                prompt;


            textarea.style.position =
                "fixed";


            textarea.style.left =
                "-9999px";


            textarea.style.top =
                "0";


            document.body.appendChild(
                textarea
            );


            textarea.focus();


            textarea.select();


            copied =
                document.execCommand(
                    "copy"
                );


            textarea.remove();

        }
        catch {

            copied =
                false;

        }

    }


    if (!win) {

        window.location.href =
            "https://chatgpt.com/";

        return;

    }


    if (copied) {

        toastGoster(
            "🤖 İçerik + yönlendirme kopyalandı. ChatGPT'ye Ctrl+V yap."
        );

    }
    else {

        toastGoster(
            "🤖 ChatGPT açıldı. Prompt otomatik kopyalanamadı."
        );

    }

}

/* =========================================================
   HTML ESCAPE
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}
