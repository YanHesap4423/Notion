<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bugünün Bilgisi</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: transparent;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: #e5e7eb;
        }

        .container {
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            padding: 12px;
        }

        /* ANA BİLGİ KARTI */

        .info-card {
            background: #292929;
            border: 1px solid #3b3b3b;
            border-radius: 14px;
            padding: 20px;
            box-shadow:
                0 4px 14px rgba(0, 0, 0, 0.15);
            transition: opacity 0.25s ease;
            user-select: none;
        }

        .info-card.paused {
            opacity: 0.9;
        }

        .lesson {
            display: inline-block;
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
            background: #353535;
            padding: 5px 9px;
            border-radius: 6px;
            margin-bottom: 10px;
        }

        .title {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.3;
            color: #f3f4f6;
            margin-bottom: 6px;
        }

        .topic {
            font-size: 13px;
            color: #9ca3af;
            margin-bottom: 12px;
        }

        .description {
            font-size: 15px;
            line-height: 1.65;
            color: #d1d5db;
            white-space: pre-wrap;
        }

        /* PROGRESS */

        .progress-wrapper {
            margin-top: 18px;
        }

        .progress-background {
            width: 100%;
            height: 4px;
            background: #404040;
            border-radius: 999px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #9ca3af;
            border-radius: 999px;
            transition: width 1s linear;
        }

        /* ALT BİLGİ */

        .bottom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 10px;
        }

        .counter {
            font-size: 12px;
            color: #777;
        }

        .pause-text {
            font-size: 11px;
            color: #666;
        }

        /* BUTONLAR */

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 14px;
            flex-wrap: wrap;
        }

        .action-button {
            flex: 1;
            min-width: 160px;
            border: 1px solid #3b3b3b;
            background: #292929;
            color: #d1d5db;
            border-radius: 9px;
            padding: 10px 14px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition:
                background 0.15s ease,
                border-color 0.15s ease,
                transform 0.1s ease;
        }

        .action-button:hover {
            background: #333333;
            border-color: #4b4b4b;
        }

        .action-button:active {
            transform: scale(0.98);
        }

        /* KONUYA GİT */

        .topic-button {
            display: none;
        }

        .topic-button.visible {
            display: block;
        }

        /* EKLE BUTONU */

        .add-button {
            width: 100%;
            margin-top: 8px;
        }

        /* EKLE PANELİ */

        .add-panel {
            display: none;
            margin-top: 12px;
            padding: 18px;
            background: #252525;
            border: 1px solid #3b3b3b;
            border-radius: 12px;
        }

        .add-panel.open {
            display: block;
        }

        .form-title {
            font-size: 15px;
            font-weight: 700;
            margin-bottom: 15px;
            color: #f3f4f6;
        }

        .form-group {
            margin-bottom: 13px;
        }

        .form-label {
            display: block;
            font-size: 12px;
            color: #9ca3af;
            margin-bottom: 6px;
        }

        .form-input,
        .form-select,
        .form-textarea {
            width: 100%;
            border: 1px solid #404040;
            background: #1f1f1f;
            color: #e5e7eb;
            border-radius: 8px;
            padding: 9px 10px;
            font-size: 13px;
            outline: none;
            font-family: inherit;
        }

        .form-input:focus,
        .form-select:focus,
        .form-textarea:focus {
            border-color: #666;
        }

        .form-textarea {
            min-height: 100px;
            resize: vertical;
            line-height: 1.5;
        }

        .submit-button {
            width: 100%;
            margin-top: 5px;
            border: none;
            background: #e5e7eb;
            color: #1f1f1f;
            border-radius: 8px;
            padding: 10px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .submit-button:hover {
            background: #ffffff;
        }

        .submit-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 10px;
            font-size: 12px;
            line-height: 1.5;
            color: #9ca3af;
        }

        .status.success {
            color: #a7f3d0;
        }

        .status.error {
            color: #fca5a5;
        }

        /* MOBİL */

        @media (max-width: 600px) {
            .container {
                padding: 8px;
            }

            .info-card {
                padding: 16px;
            }

            .title {
                font-size: 19px;
            }

            .description {
                font-size: 14px;
            }

            .action-button {
                min-width: 100%;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- BİLGİ KARTI -->

    <div
        class="info-card"
        id="infoCard"
    >

        <div
            class="lesson"
            id="lesson"
        >
            Yükleniyor...
        </div>

        <div
            class="title"
            id="title"
        >
            Bilgiler yükleniyor...
        </div>

        <div
            class="topic"
            id="topic"
        >
        </div>

        <div
            class="description"
            id="description"
        >
        </div>

        <!-- PROGRESS -->

        <div class="progress-wrapper">

            <div class="progress-background">

                <div
                    class="progress-bar"
                    id="progressBar"
                ></div>

            </div>

            <div class="bottom-row">

                <div
                    class="counter"
                    id="counter"
                >
                    0 / 0
                </div>

                <div
                    class="pause-text"
                    id="pauseText"
                >
                    Duraklatmak için üzerine gel
                </div>

            </div>

        </div>

    </div>


    <!-- BUTONLAR -->

    <div class="actions">

        <button
            class="action-button topic-button"
            id="topicButton"
        >
            📖 Konuya Git
        </button>

        <button
            class="action-button add-button"
            id="addButton"
        >
            ＋ Bilgi Ekle
        </button>

    </div>


    <!-- EKLEME PANELİ -->

    <div
        class="add-panel"
        id="addPanel"
    >

        <div class="form-title">
            Yeni Bilgi Ekle
        </div>


        <!-- DERS -->

        <div class="form-group">

            <label
                class="form-label"
                for="ders"
            >
                Ders
            </label>

            <select
                class="form-select"
                id="ders"
            >

                <option value="">
                    Ders seç
                </option>

                <option value="TYT Matematik">
                    TYT Matematik
                </option>

                <option value="TYT Türkçe">
                    TYT Türkçe
                </option>

                <option value="TYT Tarih">
                    TYT Tarih
                </option>

                <option value="TYT Coğrafya">
                    TYT Coğrafya
                </option>

                <option value="TYT Felsefe">
                    TYT Felsefe
                </option>

                <option value="TYT Din Kültürü">
                    TYT Din Kültürü
                </option>

                <option value="TYT Fizik">
                    TYT Fizik
                </option>

                <option value="TYT Kimya">
                    TYT Kimya
                </option>

                <option value="TYT Biyoloji">
                    TYT Biyoloji
                </option>

                <option value="AYT Matematik">
                    AYT Matematik
                </option>

                <option value="AYT Fizik">
                    AYT Fizik
                </option>

                <option value="AYT Kimya">
                    AYT Kimya
                </option>

                <option value="AYT Biyoloji">
                    AYT Biyoloji
                </option>

            </select>

        </div>


        <!-- KONU -->

        <div class="form-group">

            <label
                class="form-label"
                for="konu"
            >
                Konu
            </label>

            <input
                class="form-input"
                id="konu"
                type="text"
                placeholder="Örn. Ses Bilgisi"
            >

        </div>


        <!-- KONU SAYFASI -->

        <div class="form-group">

            <label
                class="form-label"
                for="konuSayfasi"
            >
                Konu Sayfası
            </label>

            <select
                class="form-select"
                id="konuSayfasi"
            >

                <option value="">
                    None
                </option>

                <option value="current">
                    Bu sayfa
                </option>

            </select>

        </div>


        <!-- BAŞLIK -->

        <div class="form-group">

            <label
                class="form-label"
                for="baslik"
            >
                Başlık
            </label>

            <input
                class="form-input"
                id="baslik"
                type="text"
                placeholder="Bilginin başlığı"
            >

        </div>


        <!-- AÇIKLAMA -->

        <div class="form-group">

            <label
                class="form-label"
                for="aciklama"
            >
                Açıklama
            </label>

            <textarea
                class="form-textarea"
                id="aciklama"
                placeholder="Bilginin kısa açıklaması..."
            ></textarea>

        </div>


        <!-- GÖNDER -->

        <button
            class="submit-button"
            id="submitButton"
        >
            Notion'a Ekle
        </button>

        <div
            class="status"
            id="status"
        ></div>

    </div>

</div>


<script>

    /* =========================================================
       AYARLAR
    ========================================================= */

    const API_URL =
        "https://yks-bilgi-api.yanhesap100yh.workers.dev";


    /* =========================================================
       ELEMENTLER
    ========================================================= */

    const infoCard =
        document.getElementById("infoCard");

    const lesson =
        document.getElementById("lesson");

    const title =
        document.getElementById("title");

    const topic =
        document.getElementById("topic");

    const description =
        document.getElementById("description");

    const progressBar =
        document.getElementById("progressBar");

    const counter =
        document.getElementById("counter");

    const pauseText =
        document.getElementById("pauseText");

    const topicButton =
        document.getElementById("topicButton");

    const addButton =
        document.getElementById("addButton");

    const addPanel =
        document.getElementById("addPanel");

    const dersInput =
        document.getElementById("ders");

    const konuInput =
        document.getElementById("konu");

    const konuSayfasiInput =
        document.getElementById("konuSayfasi");

    const baslikInput =
        document.getElementById("baslik");

    const aciklamaInput =
        document.getElementById("aciklama");

    const submitButton =
        document.getElementById("submitButton");

    const status =
        document.getElementById("status");


    /* =========================================================
       DEĞİŞKENLER
    ========================================================= */

    let bilgiler = [];

    let index = 0;

    let timer = null;

    let kalan = 10;

    let paused = false;


    /* =========================================================
       BİLGİLERİ NOTION'DAN GETİR
    ========================================================= */

    async function bilgileriGetir() {

        try {

            const response =
                await fetch(
                    API_URL + "/ozetler"
                );

            const data =
                await response.json();

            if (
                !data.success ||
                !Array.isArray(data.items)
            ) {

                throw new Error(
                    "Bilgiler alınamadı."
                );

            }

            bilgiler = data.items;

            if (bilgiler.length === 0) {

                title.textContent =
                    "Henüz aktif bilgi yok.";

                lesson.textContent =
                    "";

                topic.textContent =
                    "";

                description.textContent =
                    "Özet Havuzu'na aktif bir bilgi eklediğinde burada görünecek.";

                counter.textContent =
                    "0 / 0";

                return;

            }


            /* =================================================
               İLK BİLGİ DE RASTGELE
            ================================================= */

            index =
                Math.floor(
                    Math.random() *
                    bilgiler.length
                );


            goster();

            baslatTimer();

        }

        catch (error) {

            console.error(error);

            title.textContent =
                "Bağlantı hatası";

            description.textContent =
                "Notion'dan bilgiler alınırken bir hata oluştu.";

        }

    }


    /* =========================================================
       RASTGELE INDEX
       
       Aynı bilgi arka arkaya gelmesin.
    ========================================================= */

    function rastgeleIndexSec() {

        if (bilgiler.length <= 1) {

            return 0;

        }


        let yeniIndex;


        do {

            yeniIndex =
                Math.floor(
                    Math.random() *
                    bilgiler.length
                );

        }
        while (
            yeniIndex === index
        );


        return yeniIndex;

    }


    /* =========================================================
       BİLGİYİ EKRANA YAZ
    ========================================================= */

    function goster() {

        const bilgi =
            bilgiler[index];


        if (!bilgi) {

            return;

        }


        lesson.textContent =
            bilgi.ders || "";


        title.textContent =
            bilgi.baslik || "";


        topic.textContent =
            bilgi.konu
                ? "Konu: " + bilgi.konu
                : "";


        description.textContent =
            bilgi.aciklama || "";


        counter.textContent =
            `${index + 1} / ${bilgiler.length}`;


        /* =====================================================
           KONUYA GİT BUTONU
        ===================================================== */

        if (bilgi.notionUrl) {

            topicButton.classList.add(
                "visible"
            );

        }
        else {

            topicButton.classList.remove(
                "visible"
            );

        }

    }


    /* =========================================================
       10 SANİYE SONRA SONRAKİ RASTGELE BİLGİ
    ========================================================= */

    function sonrakiBilgi() {

        if (bilgiler.length === 0) {

            return;

        }


        index =
            rastgeleIndexSec();


        goster();


        baslatTimer();

    }


    /* =========================================================
       TIMER BAŞLAT
    ========================================================= */

    function baslatTimer() {

        clearInterval(timer);


        kalan = 10;


        progressBar.style.width =
            "0%";


        timer =
            setInterval(
                () => {

                    if (paused) {

                        return;

                    }


                    kalan--;


                    const ilerleme =
                        ((10 - kalan) / 10) * 100;


                    progressBar.style.width =
                        ilerleme + "%";


                    if (kalan <= 0) {

                        clearInterval(timer);


                        sonrakiBilgi();

                    }

                },
                1000
            );

    }


    /* =========================================================
       MOUSE İLE DURAKLAT
    ========================================================= */

    infoCard.addEventListener(
        "mouseenter",
        () => {

            paused = true;

            infoCard.classList.add(
                "paused"
            );

            pauseText.textContent =
                "Devam etmek için üzerinden çık";

        }
    );


    infoCard.addEventListener(
        "mouseleave",
        () => {

            paused = false;

            infoCard.classList.remove(
                "paused"
            );

            pauseText.textContent =
                "Duraklatmak için üzerine gel";

        }
    );


    /* =========================================================
       MOBİL / TOUCH DURAKLATMA
    ========================================================= */

    infoCard.addEventListener(
        "touchstart",
        () => {

            paused = true;

            infoCard.classList.add(
                "paused"
            );

            pauseText.textContent =
                "Devam etmek için tekrar dokun";

        },
        {
            passive: true
        }
    );


    infoCard.addEventListener(
        "touchend",
        () => {

            paused = false;

            infoCard.classList.remove(
                "paused"
            );

            pauseText.textContent =
                "Duraklatmak için üzerine gel";

        },
        {
            passive: true
        }
    );


    /* =========================================================
       KONUYA GİT
    ========================================================= */

    topicButton.addEventListener(
        "click",
        () => {

            const bilgi =
                bilgiler[index];


            if (
                !bilgi ||
                !bilgi.notionUrl
            ) {

                return;

            }


            window.open(
                bilgi.notionUrl,
                "_blank"
            );

        }
    );


    /* =========================================================
       EKLE PANELİNİ AÇ / KAPAT
    ========================================================= */

    addButton.addEventListener(
        "click",
        () => {

            addPanel.classList.toggle(
                "open"
            );

            if (
                addPanel.classList.contains(
                    "open"
                )
            ) {

                addButton.textContent =
                    "− Bilgi Ekle";

            }
            else {

                addButton.textContent =
                    "＋ Bilgi Ekle";

            }

        }
    );


    /* =========================================================
       KONU SAYFASI URL'SİNİ AL
    ========================================================= */

    function konuSayfasiUrlAl() {

        if (
            konuSayfasiInput.value !==
            "current"
        ) {

            return "";

        }


        const referrer =
            document.referrer;


        if (
            referrer &&
            referrer.includes("notion")
        ) {

            return referrer;

        }


        return "";

    }


    /* =========================================================
       NOTION'A YENİ BİLGİ EKLE
    ========================================================= */

    submitButton.addEventListener(
        "click",
        async () => {

            const ders =
                dersInput.value.trim();

            const konu =
                konuInput.value.trim();

            const baslik =
                baslikInput.value.trim();

            const aciklama =
                aciklamaInput.value.trim();


            /* ZORUNLU ALANLAR */

            if (
                !ders ||
                !baslik ||
                !aciklama
            ) {

                status.textContent =
                    "Lütfen Ders, Başlık ve Açıklama alanlarını doldur.";

                status.className =
                    "status error";

                return;

            }


            const notionUrl =
                konuSayfasiUrlAl();


            /* BUTONU KİLİTLE */

            submitButton.disabled =
                true;

            submitButton.textContent =
                "Ekleniyor...";


            status.textContent =
                "";


            try {

                const response =
                    await fetch(
                        API_URL + "/ozet-ekle",
                        {

                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            body:
                                JSON.stringify({

                                    baslik:
                                        baslik,

                                    ders:
                                        ders,

                                    konu:
                                        konu,

                                    aciklama:
                                        aciklama,

                                    notionUrl:
                                        notionUrl

                                })

                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    console.error(
                        data
                    );

                    throw new Error(
                        data.error ||
                        "Kayıt eklenemedi."
                    );

                }


                /* BAŞARILI */

                status.textContent =
                    "✓ Bilgi başarıyla Notion'a eklendi.";

                status.className =
                    "status success";


                /* FORMU TEMİZLE */

                dersInput.value =
                    "";

                konuInput.value =
                    "";

                konuSayfasiInput.value =
                    "";

                baslikInput.value =
                    "";

                aciklamaInput.value =
                    "";


                /* YENİ BİLGİLERİ ÇEK */

                await bilgileriGetir();


                /* 2 SANİYE SONRA MESAJI SİL */

                setTimeout(
                    () => {

                        status.textContent =
                            "";

                    },
                    3000
                );

            }

            catch (error) {

                console.error(error);

                status.textContent =
                    "✕ " +
                    error.message;

                status.className =
                    "status error";

            }

            finally {

                submitButton.disabled =
                    false;

                submitButton.textContent =
                    "Notion'a Ekle";

            }

        }
    );


    /* =========================================================
       BAŞLAT
    ========================================================= */

    bilgileriGetir();

</script>

</body>
</html>
