<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<style>

/* =========================================================
   TEMEL
========================================================= */

* {
    box-sizing: border-box;
}

:root {

    --notion-bg: #191919;

    --card: #121212;
    --card-dark: #101010;

    --orange: #ff7a00;
    --orange-light: #ff922b;
    --orange-dark: #c75d00;

    --border: #303030;

    --text: #f2f2f2;
    --text-soft: #cfcfcf;
    --text-muted: #888888;

}


/* =========================================================
   BODY
========================================================= */

html,
body {

    margin:
        0;

    padding:
        0;

    background:
        var(--notion-bg);

}


body {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

    color:
        var(--text);

}


/* =========================================================
   PANEL
========================================================= */

.panel {

    width:
        100%;

    max-width:
        760px;

    margin:
        auto;

    position:
        relative;

}


/* =========================================================
   KART
========================================================= */

.card {

    position:
        relative;

    background:
        linear-gradient(
            145deg,
            #151515,
            #101010
        );

    border:
        1px solid #303030;

    border-radius:
        14px;

    padding:
        22px 22px 18px;

    overflow:
        hidden;

    min-height:
        220px;

    transition:
        opacity .25s ease,
        transform .25s ease,
        border-color .2s ease,
        box-shadow .2s ease;

}


.card:hover {

    border-color:
        rgba(255,122,0,.42);

    box-shadow:
        0 8px 30px
        rgba(0,0,0,.35);

}


.card::before {

    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        0;

    right:
        0;

    height:
        2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--orange),
            transparent
        );

    opacity:
        .85;

}


.card.fade {

    opacity:
        0;

    transform:
        translateY(4px);

}


/* =========================================================
   ÜST
========================================================= */

.top-line {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;

    margin-bottom:
        10px;

}


.ders {

    display:
        inline-flex;

    align-items:
        center;

    background:
        rgba(255,122,0,.08);

    border:
        1px solid
        rgba(255,122,0,.28);

    border-radius:
        7px;

    padding:
        5px 9px;

    font-size:
        12px;

    color:
        var(--orange-light);

    font-weight:
        500;

}


.sayac {

    font-size:
        12px;

    color:
        #909090;

    min-width:
        35px;

    text-align:
        right;

    white-space:
        nowrap;

    font-variant-numeric:
        tabular-nums;

}


/* =========================================================
   BAŞLIK
========================================================= */

.baslik {

    font-size:
        23px;

    font-weight:
        650;

    line-height:
        1.3;

    margin:
        8px 0 10px;

    color:
        #f3f3f3;

    word-break:
        break-word;

}


/* =========================================================
   KONU
========================================================= */

.konu {

    font-size:
        12px;

    color:
        var(--orange-light);

    margin-bottom:
        12px;

    opacity:
        .88;

}


/* =========================================================
   AÇIKLAMA
========================================================= */

.aciklama {

    font-size:
        15px;

    line-height:
        1.65;

    color:
        var(--text-soft);

    white-space:
        pre-wrap;

    word-break:
        break-word;

}


/* =========================================================
   GÖRSEL
========================================================= */

.gorsel-wrap {

    display:
        none;

    margin-top:
        14px;

}


.gorsel-wrap.show {

    display:
        block;

}


.gorsel {

    display:
        block;

    width:
        100%;

    max-height:
        300px;

    object-fit:
        contain;

    border:
        1px solid #2d2d2d;

    border-radius:
        9px;

    background:
        #0d0d0d;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-wrap {

    margin-top:
        18px;

    height:
        4px;

    background:
        #292929;

    border-radius:
        999px;

    overflow:
        hidden;

}


.progress {

    height:
        100%;

    width:
        0%;

    background:
        linear-gradient(
            90deg,
            var(--orange-dark),
            var(--orange),
            var(--orange-light)
        );

    border-radius:
        inherit;

    transform-origin:
        left center;

    will-change:
        width;

    box-shadow:
        0 0 8px
        rgba(255,122,0,.20);

}


/* =========================================================
   BUTONLAR
========================================================= */

.buttons {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        8px;

    margin-top:
        13px;

}


button {

    border:
        1px solid #393939;

    background:
        #181818;

    color:
        #dcdcdc;

    border-radius:
        8px;

    padding:
        8px 11px;

    font-size:
        13px;

    cursor:
        pointer;

    transition:
        background .15s ease,
        border-color .15s ease,
        color .15s ease,
        transform .1s ease,
        box-shadow .15s ease;

}


button:hover {

    background:
        rgba(255,122,0,.09);

    border-color:
        rgba(255,122,0,.48);

    color:
        #ffffff;

}


button:active {

    transform:
        scale(.98);

}


button.danger {

    border-color:
        rgba(220,70,50,.30);

}


button.danger:hover {

    background:
        rgba(220,70,50,.10);

    border-color:
        rgba(220,70,50,.52);

}


/* =========================================================
   TOAST
========================================================= */

.toast {

    position:
        fixed;

    left:
        50%;

    bottom:
        24px;

    transform:
        translateX(-50%)
        translateY(15px);

    background:
        #242424;

    border:
        1px solid
        rgba(255,122,0,.40);

    color:
        #eeeeee;

    padding:
        10px 14px;

    border-radius:
        9px;

    font-size:
        12px;

    opacity:
        0;

    pointer-events:
        none;

    transition:
        opacity .2s ease,
        transform .2s ease;

    z-index:
        9999;

}


.toast.show {

    opacity:
        1;

    transform:
        translateX(-50%)
        translateY(0);

}


/* =========================================================
   AYARLAR
========================================================= */

.settings {

    display:
        none;

    margin-top:
        12px;

    background:
        #101010;

    border:
        1px solid #2d2d2d;

    border-radius:
        14px;

    padding:
        17px;

}


.settings.open {

    display:
        block;

}


.settings-title {

    font-size:
        15px;

    font-weight:
        650;

    color:
        #f2f2f2;

    margin-bottom:
        14px;

}


/* =========================================================
   SEÇİLİ NOT
========================================================= */

.selected-settings {

    background:
        #151515;

    border:
        1px solid
        rgba(255,122,0,.23);

    border-radius:
        11px;

    padding:
        14px;

    margin-bottom:
        15px;

}


.selected-label {

    font-size:
        10px;

    color:
        var(--orange);

    margin-bottom:
        6px;

    text-transform:
        uppercase;

    letter-spacing:

    font-weight:
        600;

}


.selected-title {

    font-size:
        18px;

    font-weight:
        650;

    color:
        #f4f4f4;

    margin-bottom:
        12px;

    word-break:
        break-word;

}


/* =========================================================
   AYAR GRID
========================================================= */

.setting-grid {

    display:
        grid;

    grid-template-columns:
        repeat(
            2,
            minmax(0,1fr)
        );

    gap:
        8px;

}


.setting-item {

    background:
        #101010;

    border:
        1px solid #292929;

    border-radius:
        8px;

    padding:
        10px;

    min-height:
        58px;

}


.setting-item.full {

    grid-column:
        1 / -1;

}


.setting-item .label {

    display:
        block;

    font-size:
        10px;

    color:
        #747474;

    margin-bottom:
        5px;

}


.setting-item .value {

    font-size:
        12px;

    color:
        #d2d2d2;

    word-break:
        break-word;

    line-height:
        1.45;

}


.setting-item .value.orange {

    color:
        var(--orange-light);

}


.setting-actions {

    display:
        flex;

    gap:
        8px;

    margin-top:
        12px;

    flex-wrap:
        wrap;

.note-list {

.note-list::-webkit-scrollbar {

}


.note-list::-webkit-scrollbar-track {

.note-list::-webkit-scrollbar-thumb {

.note-item {

        #151515;

        9px;

    padding:

.note-item:hover {

.note-item:active {

.note-item.selected {

.note-item-title {

    color:

    overflow:
        hidden;

}


.note-meta {

    display:
        flex;

    flex-wrap:
        wrap;

    gap:
        7px;

    margin-top:
        5px;

    font-size:
        10px;

    color:
        #777777;

    line-height:
        1.4;

}


.meta-orange {

    color:
        #c47127;

}


.active-status {

    color:
        #77ad58;

}


.passive-status {

    color:
        #767676;

}


/* =========================================================
   FORM
========================================================= */

.form {

    display:
        none;

    margin-top:
        12px;

    background:
        #101010;

    border:
        1px solid #2d2d2d;

    border-radius:
        14px;

    padding:
        17px;

}


.form.open {

    display:
        block;

}


.form-title {

    font-size:
        15px;

    font-weight:
        650;

    margin-bottom:
        14px;

    color:
        #f0f0f0;

}


.field {

    margin-bottom:
        11px;

}


.field label {

    display:
        block;

    font-size:
        11px;

    color:
        #999999;

    margin-bottom:
        5px;

}


input,
textarea,
select {

    width:
        100%;

    border:
        1px solid #333333;

    background:
        #161616;

    color:
        #dddddd;

    border-radius:
        8px;

    padding:
        9px 10px;

    font-family:
        inherit;

    font-size:
        13px;

    outline:
        none;

    transition:
        border-color .15s ease,
        box-shadow .15s ease;

}


input:focus,
textarea:focus,
select:focus {

    border-color:
        rgba(255,122,0,.58);

    box-shadow:
        0 0 0 2px

}


textarea {

    min-height:
        100px;

    resize:
        vertical;

}


.form-buttons {

    display:
        flex;

    gap:
        8px;

    margin-top:
        13px;

}


.status {

    font-size:
        12px;

    color:
        #999999;

    margin-top:
        9px;

    min-height:
        17px;

}


/* =========================================================
   MOBİL
========================================================= */

@media (max-width:520px) {

    }

    }

    }


    .toast {

        max-width:
            calc(

            );

        text-align:
            center;

        white-space:
            normal;

    }

}

</style>

/* =========================================================
   TOAST
========================================================= */

let toastTimer =
    null;


function toastGoster(
    mesaj
) {

    toast.textContent =
        mesaj;


    toast.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            () => {

                toast.classList.remove(
                    "show"
                );

            },
            3500
        );

}


/* =========================================================
   TARİH FORMATLA
========================================================= */

function tarihFormatla(
    tarih
) {

    if (!tarih) {

        return "-";

    }


    const date =
        new Date(
            tarih
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return "-";

    }


    return date.toLocaleString(
        "tr-TR",
        {

            day:
                "2-digit",

            month:
                "2-digit",

            year:
                "numeric",

            hour:
                "2-digit",

            minute:
                "2-digit"

        }
    );

}


/* =========================================================
   API DİZİSİNİ GÜVENLİ AL
========================================================= */

function responseItems(
    data
) {

    if (
        Array.isArray(
            data?.data
        )
    ) {

        return data.data;

    }


    if (
        Array.isArray(
            data?.items
        )
    ) {

        return data.items;

    }


    return [];

}


/* =========================================================
   AKTİF VERİLERİ GETİR
========================================================= */

async function verileriGetir(
    ilkYukleme = false
) {

    try {

        const response =
            await fetch(
                API +
                "/ozetler",
                {
                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Veriler alınamadı."
            );

        }


        bilgiler =
            responseItems(
                data
            );


        if (
            !bilgiler.length
        ) {

            cancelAnimationFrame(
                timer
            );


            baslik.textContent =
                "Henüz aktif bilgi yok.";


            ders.textContent =
                "Bilgi";


            konu.textContent =
                "";


            aciklama.textContent =
                "";


            sayac.textContent =
                "";


            progress.style.width =
                "0%";


            gorselWrap.classList.remove(
                "show"
            );


            return;

        }


        if (
            ilkYukleme ||
            !seciliNot
        ) {

            rastgeleNotGoster();

            return;

        }


        const mevcut =
            bilgiler.find(
                item =>
                    item.id ===
                    seciliNot.id
            );


        if (mevcut) {

            seciliNot =
                mevcut;

            seciliIndex =
                bilgiler.findIndex(
                    item =>
                        item.id ===
                        mevcut.id
                );

        }

    }
    catch (error) {

        console.error(
            error
        );


        baslik.textContent =
            "Bilgiler yüklenemedi.";


        aciklama.textContent =
            "API bağlantısını kontrol edin.";

    }

}


/* =========================================================
   TÜM NOTLARI GETİR
========================================================= */

async function tumNotlariGetir() {

    try {

        const response =
            await fetch(
                API +
                "/ozetler-tumu",
                {
                    cache:
                        "no-store"
                }
            );


        const data =
            await response.json();


        if (
            !data.success
        ) {

            throw new Error(
                data.error ||
                "Kayıtlar alınamadı."
            );

        }


        ayarBilgileri =
            responseItems(
                data
            );


        if (seciliNot) {

            const guncel =
                ayarBilgileri.find(
                    item =>
                        item.id ===
                        seciliNot.id
                );


            if (guncel) {

                seciliNot =
                    guncel;

            }

        }


        seciliNotuGoster();

        ayarlarListesiniOlustur();

    }
    catch (error) {

        console.error(
            error
        );


        document.getElementById(
            "noteList"
        ).innerHTML = `

            <div style="
                color:#777;
                font-size:12px;
                padding:10px 0;
            ">

                Kayıtlar alınamadı.

            </div>

        `;

    }

}


/* =========================================================
   RASTGELE NOT
========================================================= */

function rastgeleNotGoster() {

    if (
        !bilgiler.length
    ) {

        return;

    }


    let yeniIndex;


    do {

        yeniIndex =
            Math.floor(
                Math.random() *
                bilgiler.length
            );

    }
    while (
        bilgiler.length > 1 &&
        yeniIndex ===
            seciliIndex
    );


    seciliIndex =
        yeniIndex;


    seciliNot =
        bilgiler[
            seciliIndex
        ];


    kartGoster(
        seciliNot
    );


    timerBaslat();

}


/* =========================================================
   KART GÖSTER
========================================================= */

function kartGoster(
    item
) {

    card.classList.add(
        "fade"
    );


    setTimeout(
        () => {

            ders.textContent =
                item.ders ||
                "Bilgi";


            baslik.textContent =
                item.baslik ||
                "";


            konu.textContent =
                item.konu
                    ? "Konu: " +
                      item.konu
                    : "";


            aciklama.textContent =
                item.aciklama ||
                "";


            sayac.textContent =
                SURE +
                " sn";


            progress.style.width =
                "0%";


            /* GÖRSEL */

            if (
                item.gorsel
            ) {

                gorsel.src =
                    item.gorsel;

                gorsel.alt =
                    item.baslik ||
                    "Bilgi görseli";

                gorselWrap.classList.add(
                    "show"
                );

            }
            else {

                gorsel.removeAttribute(
                    "src"
                );

                gorselWrap.classList.remove(
                    "show"
                );

            }


            card.classList.remove(
                "fade"
            );


            gosterimiKaydet(
                item
            );

        },
        220
    );

}


/* =========================================================
   GÖSTERİM KAYDET
========================================================= */

async function gosterimiKaydet(
    item
) {

    if (
        !item ||
        !item.id
    ) {

        return;

    }


    let oncekiGosterim =
        sonGosterimCache[
            item.id
        ] ||
        null;


    if (
        !oncekiGosterim &&
        item.sonGosterim
    ) {

        oncekiGosterim =
            item.sonGosterim;

    }


    const simdikiGosterim =
        new Date().toISOString();


    try {

        const response =
            await fetch(
                API +
                "/ozet-goster/" +
                encodeURIComponent(
                    item.id
                ),
                {

                    method:
                        "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            oncekiGosterim:
                                oncekiGosterim

                        })

                }
            );


        const data =
            await response.json();


        if (
            !data.success
        ) {

            console.error(
                "Gösterim güncellenemedi:",
                data
            );

            return;

        }


        sonGosterimCache[
            item.id
        ] =
            simdikiGosterim;


        if (
            data.item
        ) {

            const ana =
                bilgiler.find(
                    x =>
                        x.id ===
                        item.id
                );


            if (ana) {

                Object.assign(
                    ana,
                    data.item
                );

            }


            const ayar =
                ayarBilgileri.find(
                    x =>
                        x.id ===
                        item.id
                );


            if (ayar) {

                Object.assign(
                    ayar,
                    data.item
                );

            }


            if (
                seciliNot &&
                seciliNot.id ===
                item.id
            ) {

                Object.assign(
                    seciliNot,
                    data.item
                );


                if (
                    settings.classList.contains(
                        "open"
                    )
                ) {

                    seciliNotuGoster();

                    ayarlarListesiniOlustur();

                }

            }

        }

    }
    catch (error) {

        console.error(
            "Gösterim kaydı hatası:",
            error
        );

    }

}


/* =========================================================
   AKICI TIMER
========================================================= */

function timerBaslat() {

    cancelAnimationFrame(
        timer
    );


    kalanSure =
        SURE;


    sonZaman =
        performance.now();


    progress.style.width =
        "0%";


    sayac.textContent =
        SURE +
        " sn";


    timer =
        requestAnimationFrame(
            timerDongusu
        );

}


function timerDongusu(
    zaman
) {

    const duraklatildi =
        mousePause ||
        settingsPause ||
        formPause;


    if (
        !duraklatildi
    ) {

        const delta =
            (
                zaman -
                sonZaman
            ) / 1000;


        kalanSure -=
            delta;


        if (
            kalanSure < 0
        ) {

            kalanSure =
                0;

        }


        const yuzde =
            (
                (SURE - kalanSure) /
                SURE
            ) * 100;


        progress.style.width =
            yuzde +
            "%";


        sayac.textContent =
            Math.ceil(
                kalanSure
            ) +
            " sn";

    }


    sonZaman =
        zaman;


    if (
        kalanSure <= 0
    ) {

        rastgeleNotGoster();

        return;

    }


    timer =
        requestAnimationFrame(
            timerDongusu
        );

}

    const selectedEklenme =
        document.getElementById(
            "selectedEklenme"
        );


    const selectedSonGosterim =
        document.getElementById(
            "selectedSonGosterim"

        document.getElementById(

        seciliNot.ders ||

    selectedKonu.textContent =
        seciliNot.konu ||

            : "Belirli değil";

        seciliNot.aktif

            : "○ Pasif";


    selectedAktif.className =
        seciliNot.aktif
            ? "value active-status"
            : "value passive-status";


    selectedEklenme.textContent =
        tarihFormatla(
            seciliNot.eklenmeTarihi
        );


    selectedSonGosterim.textContent =
        tarihFormatla(
            seciliNot.sonGosterim
        );


    selectedGosterim.textContent =
        seciliNot.gosterimSayisi ||
        0;

}


/* =========================================================
   DİĞER KAYITLAR
========================================================= */

function ayarlarListesiniOlustur() {

    const list =
        document.getElementById(
            "noteList"
        );


    if (
        !ayarBilgileri.length
    ) {

        list.innerHTML = `

            <div style="
                color:#777;
                font-size:12px;
                padding:10px 0;
            ">

                Henüz kayıt bulunmuyor.

            </div>

        `;

        return;

    }


    list.innerHTML =
        ayarBilgileri
            .map(
                item => {

                    const selected =
                        seciliNot &&
                        item.id ===
                        seciliNot.id
                            ? "selected"
                            : "";


                    const tarih =
                        tarihFormatla(
                            item.eklenmeTarihi
                        );


                    const son =
                        tarihFormatla(
                            item.sonGosterim
                        );


                    return `

                        <div
                            class="note-item ${selected}"
                            onclick="ayarNotuSec('${escapeJs(item.id)}')"
                        >

                            <div
                                style="
                                    flex:1;
                                    min-width:0;
                                "
                            >

                                <div
                                    class="note-item-title"
                                >

                                    ${escapeHtml(
                                        item.baslik ||
                                        "Başlıksız"
                                    )}

                                </div>


                                <div
                                    class="note-meta"
                                >

                                    <span>
                                        ${escapeHtml(
                                            item.ders ||
                                            "-"
                                        )}
                                    </span>


                                    <span
                                        class="meta-orange"
                                    >

                                        ${escapeHtml(
                                            item.konu ||
                                            "Konu yok"
                                        )}

                                    </span>


                                    <span>
                                        📅 Eklendi:
                                        ${tarih}
                                    </span>


                                    <span>
                                        👁 Gösterim:
                                        ${
                                            item.gosterimSayisi ||
                                            0
                                        }
                                    </span>


                                    <span>
                                        🕒 Son:
                                        ${son}
                                    </span>


                                    <span
                                        class="${
                                            item.aktif
                                                ? "active-status"
                                                : "passive-status"
                                        }"
                                    >

                                        ${
                                            item.aktif
                                                ? "● Aktif"
                                                : "○ Pasif"
                                        }

                                    </span>

                                </div>

                            </div>

                        </div>

                    `;

                }
            )
            .join("");

}


/* =========================================================
   AYARLARDAN NOT SEÇ
========================================================= */

function ayarNotuSec(
    id
) {

    const bulunan =
        ayarBilgileri.find(
            item =>
                item.id ===
                id
        );


    if (!bulunan) {

        return;

    }


    seciliNot =
        bulunan;


    const aktifIndex =
        bilgiler.findIndex(
            item =>
                item.id ===
                bulunan.id
        );


    if (
        aktifIndex !== -1
    ) {

        seciliIndex =
            aktifIndex;

    }


    seciliNotuGoster();


    ayarlarListesiniOlustur();

}

/* =========================================================
   SİL
========================================================= */

async function seciliNotuSil() {

    if (!seciliNot || !seciliNot.id) {

        alert(
            "Önce bir not seç."
        );

        return;

    }

    const silinenId =
        seciliNot.id;

    const silinenBaslik =
        seciliNot.baslik ||
        "Bu not";

    const onay =
        confirm(
            `"${silinenBaslik}" notunu silmek istediğine emin misin?`
        );

    if (!onay) {
        return;
    }

    try {

        const response =
            await fetch(
                API +
                "/ozet-sil/" +
                encodeURIComponent(
                    silinenId
                ),
                {
                    method: "DELETE"
                }
            );

        const data =
            await response.json();

        if (!response.ok || !data.success) {

            throw new Error(
                data.error ||
                "Not silinemedi."
            );

        }

        /* CACHE'DEN SİL */

        delete sonGosterimCache[
            silinenId
        ];


        /* AKTİF LİSTEDEN SİL */

        bilgiler =
            bilgiler.filter(
                item =>
                    item.id !==
                    silinenId
            );


        /* TÜM KAYITLARDAN SİL */

        ayarBilgileri =
            ayarBilgileri.filter(
                item =>
                    item.id !==
                    silinenId
            );


        /* EĞER EKRANDAKİ NOT SİLİNDİYSE */

        const aktifKartSilindi =
            seciliNot &&
            seciliNot.id ===
            silinenId;


        if (aktifKartSilindi) {

            seciliNot = null;

            seciliIndex = -1;

            if (bilgiler.length > 0) {

                rastgeleNotGoster();

            }
            else {

                cancelAnimationFrame(
                    timer
                );

                baslik.textContent =
                    "Henüz aktif bilgi yok.";

                ders.textContent =
                    "Bilgi";

                konu.textContent =
                    "";

                aciklama.textContent =
                    "";

                sayac.textContent =
                    "";

                progress.style.width =
                    "0%";

                gorselWrap.classList.remove(
                    "show"
                );

            }

        }
        else {

            /* Başka bir kayıt seçiliyse onu koru */

            const guncel =
                ayarBilgileri.find(
                    item =>
                        item.id ===
                        seciliNot?.id
                );

            if (guncel) {

                seciliNot =
                    guncel;

            }

        }


        seciliNotuGoster();

        ayarlarListesiniOlustur();


        toastGoster(
            "✓ Not silindi."
        );

    }
    catch (error) {

        console.error(
            "Not silme hatası:",
            error
        );

        alert(
            "Not silinemedi: " +
            error.message
        );

    }

}

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                payload
                            )

                    }
                );

        }
        else {

            response =
                await fetch(
                    API +
                    "/ozet-ekle",
                    {

                        method:
                            "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body:
                            JSON.stringify(
                                payload
                            )

                    }
                );

        }


        const data =
            await response.json();


        if (
            !data.success
        ) {

            throw new Error(
                data.error ||
                "İşlem başarısız."
            );

        }


        if (
            duzenlemeModu &&
            data.item
        ) {

            const editedId =
                data.item.id;


            const ana =
                bilgiler.find(
                    item =>
                        item.id ===
                        editedId
                );


            if (ana) {

                Object.assign(
                    ana,
                    data.item
                );

            }


            const ayar =
                ayarBilgileri.find(
                    item =>
                        item.id ===
                        editedId
                );


            if (ayar) {

                Object.assign(
                    ayar,
                    data.item
                );

            }


            seciliNot =
                data.item;


            const aktifIndex =
                bilgiler.findIndex(
                    item =>
                        item.id ===
                        editedId
                );


            if (
                aktifIndex !== -1
            ) {

                seciliIndex =
                    aktifIndex;


                ders.textContent =
                    data.item.ders ||
                    "Bilgi";


                baslik.textContent =
                    data.item.baslik ||
                    "";


                konu.textContent =
                    data.item.konu
                        ? "Konu: " +
                          data.item.konu
                        : "";


                aciklama.textContent =
                    data.item.aciklama ||
                    "";


                if (
                    data.item.gorsel
                ) {

                    gorsel.src =
                        data.item.gorsel;

                    gorselWrap.classList.add(
                        "show"
                    );

                }
                else {

                    gorsel.removeAttribute(
                        "src"
                    );

                    gorselWrap.classList.remove(
                        "show"
                    );

                }

            }

        }
        else if (
            data.item
        ) {

            ayarBilgileri.push(
                data.item
            );


            if (
                data.item.aktif
            ) {

                bilgiler.push(
                    data.item
                );

            }

        }


        formuKapat();


        if (
            settings.classList.contains(
                "open"
            )
        ) {

            await tumNotlariGetir();

        }


        const mesaj =
            duzenlemeModu
                ? "✓ Not güncellendi."
                : "✓ Bilgi eklendi.";


        toastGoster(
            mesaj
        );


    }
    catch (error) {

        console.error(
            error
        );


        status.textContent =
            "Hata: " +
            error.message;

    }

}


/* =========================================================
   KONU SAYFASI URL
========================================================= */

function konuSayfasiUrlAl() {

    const secim =
        document.getElementById(
            "konuSayfasiInput"
        ).value;


    if (
        secim !==
        "current"
    ) {

        return "";

    }


    if (
        duzenlemeModu &&
        seciliNot &&
        seciliNot.notionUrl
    ) {

        return seciliNot.notionUrl;

    }


    /*
       index1 / diğer embedlerde olduğu gibi
       önce page parametresini kullan.
    */

    if (
        embedPageUrl
    ) {

        return embedPageUrl;

    }


    const referrer =
        document.referrer;


    if (
        referrer
    ) {

        return referrer;

    }


    return "";

}


/* =========================================================
   KONUYA GİT
========================================================= */

function konuyaGit() {

    if (
        !seciliNot ||
        !seciliNot.notionUrl
    ) {

        alert(
            "Konu belirli değil."
        );

        return;

    }


    const link =
        document.createElement(
            "a"
        );


    link.href =
        seciliNot.notionUrl;


    link.target =
        "_blank";


    link.rel =
        "noopener noreferrer";


    link.style.display =
        "none";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();

}


/* =========================================================
   YAPAY ZEKA
========================================================= */

function yapayZeka() {

    if (!seciliNot) {

        alert(
            "Önce bir bilgi seçili olmalı."
        );

        return;

    }


    const prompt =
`Ders: ${seciliNot.ders || "-"}

Başlık: ${seciliNot.baslik || "-"}

Açıklama: ${seciliNot.aciklama || "-"}

Bu konuyu açıkla.`;


    const chatUrl =
        "https://chatgpt.com/?q=" +
        encodeURIComponent(
            prompt
        );


    const link =
        document.createElement(
            "a"
        );


    link.href =
        chatUrl;


    link.target =
        "_blank";


    link.rel =
        "noopener noreferrer";


    link.style.display =
        "none";


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();

}


/* =========================================================
   ESC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key !==
            "Escape"
        ) {

            return;

        }


        if (
            form.classList.contains(
                "open"
            )
        ) {

            formuKapat();

        }


        if (
            settings.classList.contains(
                "open"
            )
        ) {

            ayarlariKapat();

        }

    }
);


/* =========================================================
   SEKME GÖRÜNMEZSE DURDUR
========================================================= */

document.addEventListener(
    "visibilitychange",
    () => {

        if (
            document.hidden
        ) {

            mousePause =
                true;

            return;

        }


        mousePause =
            false;


        sonZaman =
            performance.now();

    }
);


/* =========================================================
   HTML GÜVENLİĞİ
========================================================= */

function escapeHtml(
    value
) {

    return String(
        value
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}


/* =========================================================
   JS STRING GÜVENLİĞİ
========================================================= */

function escapeJs(
    value
) {

    return String(
        value
    )
        .replace(
            /\\/g,
            "\\\\"
        )
        .replace(
            /'/g,
            "\\'"
        )
        .replace(
            /"/g,
            '\\"'
        );

}

verileriGetir(
