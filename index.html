<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bugünün Bilgisi</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            background: transparent;
        }


        /* ANA PANEL */

        .panel {
            width: 100%;
            max-width: 650px;
            margin: 0 auto;
        }


        /* CALLOUT */

        .card {
            min-height: 180px;

            padding: 28px;

            border-radius: 6px;

            background: #2f2f2f;
            border: 1px solid #3a3a3a;

            color: #ffffff;

            display: flex;
            flex-direction: column;
            justify-content: center;

            transition:
                opacity 0.35s ease,
                transform 0.35s ease;

            cursor: default;

            user-select: none;

            -webkit-user-select: none;

            touch-action: manipulation;
        }


        /* DERS */

        .subject {
            font-size: 14px;

            font-weight: 600;

            margin-bottom: 10px;

            color: #b5b5b5;
        }


        /* BAŞLIK */

        .title {
            font-size: 23px;

            font-weight: 700;

            margin-bottom: 12px;

            color: #ffffff;
        }


        /* İÇERİK */

        .content {
            font-size: 16px;

            line-height: 1.6;

            color: #e6e6e6;
        }


        /* YÜKLENİYOR */

        .loading {
            color: #999999;

            font-size: 15px;
        }


        /* HATA */

        .error {
            color: #ff8a8a;

            font-size: 14px;

            line-height: 1.5;
        }


        /* SÜRE ÇUBUĞININ ARKA PLANI */

        .progress-container {

            width: 100%;

            height: 5px;

            margin-top: 12px;

            overflow: hidden;

            border-radius: 10px;

            background: #444444;
        }


        /* SÜRE ÇUBUĞI */

        .progress {

            height: 100%;

            width: 100%;

            transform-origin: left;

            background: #ffffff;

            transform: scaleX(1);
        }


        /* SAYI */

        .counter {

            text-align: right;

            margin-top: 7px;

            font-size: 12px;

            color: #888888;
        }


        /* MOBİL */

        @media (max-width: 500px) {

            body {
                padding: 10px;
            }

            .card {
                padding: 22px;
            }

            .title {
                font-size: 20px;
            }

            .content {
                font-size: 15px;
            }

        }

    </style>

</head>


<body>


<div class="panel">


    <!-- CALLOUT -->

    <div
        class="card"
        id="card"
    >

        <div
            class="subject"
            id="subject"
        ></div>


        <div
            class="title"
            id="title"
        ></div>


        <div
            class="content"
            id="content"
        ></div>

    </div>


    <!-- SÜRE ÇUBUĞU -->

    <div
        class="progress-container"
    >

        <div
            class="progress"
            id="progress"
        ></div>

    </div>


    <!-- SAYI -->

    <div
        class="counter"
        id="counter"
    ></div>


</div>



<script>


/* =========================================================
   API
   ========================================================= */


/*
   Notion → Cloudflare Worker
*/

const API_URL =
    "https://yks-bilgi-api.yanhesap100yh.workers.dev/ozetler";



/* =========================================================
   AYARLAR
   ========================================================= */


/*
   Bir bilginin ekranda kalacağı süre
*/

const sure = 10000;



/* =========================================================
   DEĞİŞKENLER
   ========================================================= */


/*
   Notion'dan gelecek bilgiler
*/

let bilgiler = [];


/*
   Şu anda gösterilen bilgi
*/

let index = 0;


/*
   Kalan süre
*/

let kalanSure = sure;


/*
   Zamanlayıcı
*/

let zamanlayici = null;


/*
   Zamanlayıcının başladığı an
*/

let baslangicZamani = null;



/* =========================================================
   HTML ELEMANLARI
   ========================================================= */

const subject =
    document.getElementById("subject");


const title =
    document.getElementById("title");


const content =
    document.getElementById("content");


const progress =
    document.getElementById("progress");


const counter =
    document.getElementById("counter");


const card =
    document.getElementById("card");



/* =========================================================
   NOTION VERİLERİNİ GETİR
   ========================================================= */

async function bilgileriGetir() {

    try {

        /*
           API'den verileri al
        */

        const response =
            await fetch(API_URL);


        /*
           HTTP hatası varsa
        */

        if (!response.ok) {

            throw new Error(
                `API hatası: ${response.status}`
            );

        }


        /*
           JSON'a çevir
        */

        const data =
            await response.json();


        /*
           API başarısız döndüyse
        */

        if (!data.success) {

            throw new Error(
                data.error ||
                "Bilgiler alınamadı."
            );

        }


        /*
           Notion kayıtlarını
           panel formatına çevir
        */

        bilgiler =
            (data.items || [])
                .map(bilgi => ({

                    subject:
                        bilgi.ders
                            ? `📚 ${bilgi.ders}`
                            : "📚 YKS",

                    title:
                        bilgi.baslik || "Başlıksız",

                    content:
                        bilgi.aciklama || ""

                }))
                .filter(bilgi =>
                    bilgi.title &&
                    bilgi.content
                );


        /*
           Hiç aktif bilgi yoksa
        */

        if (bilgiler.length === 0) {

            throw new Error(
                "Notion'da gösterilecek aktif bilgi bulunamadı."
            );

        }


        /*
           İlk bilgiyi göster
        */

        index = 0;

        kalanSure = sure;

        goster();

        zamanlayiciyiBaslat();

    }

    catch (error) {

        console.error(
            "Bilgi alma hatası:",
            error
        );


        subject.textContent =
            "⚠️ Bugünün Bilgisi";


        title.textContent =
            "Bilgiler yüklenemedi";


        content.textContent =
            error.message;


        content.className =
            "content error";


        counter.textContent =
            "";


        progress.style.transform =
            "scaleX(0)";

    }

}



/* =========================================================
   BİLGİYİ GÖSTER
   ========================================================= */

function goster() {

    const bilgi =
        bilgiler[index];


    /*
       Eski içeriği gizle
    */

    card.style.opacity =
        "0";


    card.style.transform =
        "translateY(8px)";


    setTimeout(() => {

        /*
           Yeni içerik
        */

        subject.textContent =
            bilgi.subject;


        title.textContent =
            bilgi.title;


        content.textContent =
            bilgi.content;


        content.className =
            "content";


        counter.textContent =
            `${index + 1} / ${bilgiler.length}`;


        /*
           Kartı göster
        */

        card.style.opacity =
            "1";


        card.style.transform =
            "translateY(0)";


        /*
           Progress bar'ı sıfırla
        */

        progress.style.transition =
            "none";


        progress.style.transform =
            "scaleX(1)";


        /*
           Tarayıcıya güncellemeyi uygulat
        */

        requestAnimationFrame(() => {

            requestAnimationFrame(() => {

                progress.style.transition =
                    `transform ${kalanSure}ms linear`;


                progress.style.transform =
                    "scaleX(0)";

            });

        });

    }, 300);

}



/* =========================================================
   SONRAKİ BİLGİ
   ========================================================= */

function sonraki() {

    index++;


    /*
       Son bilgiye geldiysek
       tekrar ilk bilgiye dön
    */

    if (index >= bilgiler.length) {

        index = 0;

    }


    /*
       Yeni bilgi için süreyi sıfırla
    */

    kalanSure = sure;


    /*
       Yeni bilgiyi göster
    */

    goster();


    /*
       Yeni zamanlayıcı başlat
    */

    zamanlayiciyiBaslat();

}



/* =========================================================
   ZAMANLAYICIYI BAŞLAT
   ========================================================= */

function zamanlayiciyiBaslat() {

    /*
       Zaten çalışıyorsa tekrar başlatma
    */

    if (zamanlayici !== null) {

        return;

    }


    /*
       Başlangıç zamanını kaydet
    */

    baslangicZamani =
        Date.now();


    /*
       Kalan süre kadar bekle
    */

    zamanlayici =
        setTimeout(() => {

            /*
               Zamanlayıcıyı temizle
            */

            zamanlayici = null;


            /*
               Sonraki bilgiye geç
            */

            sonraki();

        }, kalanSure);

}



/* =========================================================
   ZAMANLAYICIYI DURDUR
   ========================================================= */

function zamanlayiciyiDurdur() {

    /*
       Zamanlayıcı çalışmıyorsa
    */

    if (zamanlayici === null) {

        return;

    }


    /*
       Zamanlayıcıyı durdur
    */

    clearTimeout(zamanlayici);


    /*
       Ne kadar zaman geçti?
    */

    const gecenSure =
        Date.now() - baslangicZamani;


    /*
       Kalan süreden çıkar
    */

    kalanSure =
        kalanSure - gecenSure;


    /*
       Negatif olmasını engelle
    */

    if (kalanSure < 0) {

        kalanSure = 0;

    }


    /*
       Progress bar'ın
       mevcut konumu
    */

    const mevcutOran =
        Math.max(
            0,
            kalanSure / sure
        );


    /*
       Progress bar'ı dondur
    */

    progress.style.transition =
        "none";


    progress.style.transform =
        `scaleX(${mevcutOran})`;


    /*
       Zamanlayıcı artık çalışmıyor
    */

    zamanlayici = null;

}



/* =========================================================
   DEVAM ET
   ========================================================= */

function devamEt() {

    /*
       Zaten çalışıyorsa
    */

    if (zamanlayici !== null) {

        return;

    }


    /*
       Süre bittiyse
    */

    if (kalanSure <= 0) {

        sonraki();

        return;

    }


    /*
       Kaldığı yerden devam et
    */

    zamanlayiciyiBaslat();


    /*
       Progress bar'ı devam ettir
    */

    progress.style.transition =
        `transform ${kalanSure}ms linear`;


    progress.style.transform =
        "scaleX(0)";

}



/* =========================================================
   MOUSE
   ========================================================= */

card.addEventListener(
    "mouseenter",
    () => {

        zamanlayiciyiDurdur();

    }
);


card.addEventListener(
    "mouseleave",
    () => {

        devamEt();

    }
);



/* =========================================================
   TOUCH / TELEFON
   ========================================================= */

card.addEventListener(
    "touchstart",
    () => {

        zamanlayiciyiDurdur();

    },
    {
        passive: true
    }
);


card.addEventListener(
    "touchend",
    () => {

        devamEt();

    },
    {
        passive: true
    }
);



/* =========================================================
   BAŞLAT
   ========================================================= */

bilgileriGetir();


</script>


</body>
</html>
