<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kısa Not Ekle</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    background: #191919;
    color: #ffffff;
    font-family: Arial, Helvetica, sans-serif;
}

.container {
    max-width: 700px;
    margin: auto;
}

.card {
    background: #111111;
    border: 1px solid #2b2b2b;
    border-radius: 14px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
}

h1 {
    margin: 0 0 22px;
    font-size: 22px;
}

label {
    display: block;
    margin: 18px 0 8px;
    color: #bdbdbd;
    font-size: 14px;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid #333;
    border-radius: 9px;
    background: #1d1d1d;
    color: white;
    padding: 12px;
    font-size: 14px;
    outline: none;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #ff8c00;
}

textarea {
    min-height: 150px;
    resize: vertical;
}

.source-box {
    margin-top: 18px;
    padding: 12px;
    background: #181818;
    border: 1px solid #2c2c2c;
    border-radius: 9px;
    font-size: 12px;
    color: #999;
    word-break: break-all;
}

.source-box strong {
    color: #ddd;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-top: 20px;
}

button {
    flex: 1;
    border: 0;
    border-radius: 9px;
    padding: 12px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
}

.save {
    background: #ff8c00;
    color: #111;
}

.save:hover {
    background: #ff9f2f;
}

.clear {
    background: #292929;
    color: white;
}

.clear:hover {
    background: #353535;
}

.status {
    margin-top: 16px;
    padding: 12px;
    border-radius: 9px;
    display: none;
    font-size: 13px;
}

.status.success {
    display: block;
    background: #17351f;
    border: 1px solid #285c36;
    color: #8ee8a5;
}

.status.error {
    display: block;
    background: #351717;
    border: 1px solid #632828;
    color: #ff9c9c;
}

.detected {
    margin-top: 8px;
    color: #ff9f2f;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h1>📝 Kısa Not Ekle</h1>

        <label for="baslik">Başlık</label>
        <input
            id="baslik"
            type="text"
            placeholder="Örneğin: Kavimler Göçü"
        >

        <label for="ders">Ders</label>
        <select id="ders">

            <option value="">Ders seçiliyor...</option>

            <option>TYT Matematik</option>
            <option>TYT Türkçe</option>
            <option>TYT Tarih</option>
            <option>TYT Coğrafya</option>
            <option>TYT Felsefe</option>
            <option>TYT Din Kültürü</option>
            <option>TYT Fizik</option>
            <option>TYT Kimya</option>
            <option>TYT Biyoloji</option>

            <option>AYT Matematik</option>
            <option>AYT Fizik</option>
            <option>AYT Kimya</option>
            <option>AYT Biyoloji</option>

        </select>

        <div id="detected" class="detected"></div>

        <label for="aciklama">Kısa Not</label>

        <textarea
            id="aciklama"
            placeholder="Kısa notunu buraya yaz..."
        ></textarea>

        <div class="source-box">

            <strong>Kaynak sayfa:</strong>

            <div id="sourceUrl">
                Kaynak sayfa bulunuyor...
            </div>

        </div>

        <div class="buttons">

            <button
                class="save"
                id="saveButton"
                onclick="kaydet()"
            >
                💾 Kısa Notu Kaydet
            </button>

            <button
                class="clear"
                onclick="temizle()"
            >
                Temizle
            </button>

        </div>

        <div
            id="status"
            class="status"
        ></div>

    </div>

</div>


<script>

/* =========================================================
   AYARLAR
========================================================= */

const WORKER_URL =
    "https://yks-bilgi-api.yanhesap100yh.workers.dev";


/* =========================================================
   URL PARAMETRESİ
========================================================= */

const params =
    new URLSearchParams(window.location.search);


/*
   Öncelik:

   1. ?page=...
   2. document.referrer
   3. boş
*/

const kaynakUrl =
    params.get("page") ||
    document.referrer ||
    "";


/* =========================================================
   DERS ALGILAMA
========================================================= */

function normalizeUrl(url) {

    try {

        return decodeURIComponent(url)
            .toLowerCase()
            .replaceAll("ı", "i")
            .replaceAll("ş", "s")
            .replaceAll("ğ", "g")
            .replaceAll("ü", "u")
            .replaceAll("ö", "o")
            .replaceAll("ç", "c");

    } catch {

        return url
            .toLowerCase()
            .replaceAll("ı", "i")
            .replaceAll("ş", "s")
            .replaceAll("ğ", "g")
            .replaceAll("ü", "u")
            .replaceAll("ö", "o")
            .replaceAll("ç", "c");

    }

}


function dersBul(url) {

    const u =
        normalizeUrl(url);

    const eslesmeler = [

        {
            ders: "TYT Türkçe",
            kelimeler: [
                "tyt-turkce",
                "tyt_turkce",
                "tytturkce",
                "turkce"
            ]
        },

        {
            ders: "TYT Matematik",
            kelimeler: [
                "tyt-matematik",
                "tyt_matematik",
                "tytmatematik"
            ]
        },

        {
            ders: "TYT Tarih",
            kelimeler: [
                "tyt-tarih",
                "tyt_tarih",
                "tyttarih"
            ]
        },

        {
            ders: "TYT Coğrafya",
            kelimeler: [
                "tyt-cografya",
                "tyt_cografya",
                "tytcografya"
            ]
        },

        {
            ders: "TYT Felsefe",
            kelimeler: [
                "tyt-felsefe",
                "tyt_felsefe",
                "tytfelsefe"
            ]
        },

        {
            ders: "TYT Din Kültürü",
            kelimeler: [
                "tyt-din",
                "tyt_din",
                "tytdin",
                "din-kulturu"
            ]
        },

        {
            ders: "TYT Fizik",
            kelimeler: [
                "tyt-fizik",
                "tyt_fizik",
                "tytfizik"
            ]
        },

        {
            ders: "TYT Kimya",
            kelimeler: [
                "tyt-kimya",
                "tyt_kimya",
                "tytkimya"
            ]
        },

        {
            ders: "TYT Biyoloji",
            kelimeler: [
                "tyt-biyoloji",
                "tyt_biyoloji",
                "tytbiyoloji"
            ]
        },

        {
            ders: "AYT Matematik",
            kelimeler: [
                "ayt-matematik",
                "ayt_matematik",
                "aytmatematik"
            ]
        },

        {
            ders: "AYT Fizik",
            kelimeler: [
                "ayt-fizik",
                "ayt_fizik",
                "aytfizik"
            ]
        },

        {
            ders: "AYT Kimya",
            kelimeler: [
                "ayt-kimya",
                "ayt_kimya",
                "aytkimya"
            ]
        },

        {
            ders: "AYT Biyoloji",
            kelimeler: [
                "ayt-biyoloji",
                "ayt_biyoloji",
                "aytbyoloji",
                "aytbioloji"
            ]
        }

    ];


    for (const item of eslesmeler) {

        for (const kelime of item.kelimeler) {

            if (u.includes(kelime)) {

                return item.ders;

            }

        }

    }

    return "";

}


/* =========================================================
   SAYFA YÜKLENDİĞİNDE
========================================================= */

function baslat() {

    const source =
        document.getElementById("sourceUrl");

    const dersSelect =
        document.getElementById("ders");

    const detected =
        document.getElementById("detected");


    if (kaynakUrl) {

        source.textContent =
            kaynakUrl;

    } else {

        source.textContent =
            "Kaynak sayfa bulunamadı.";

    }


    const bulunanDers =
        dersBul(kaynakUrl);


    if (bulunanDers) {

        dersSelect.value =
            bulunanDers;

        detected.textContent =
            "✓ Ders otomatik algılandı: " +
            bulunanDers;

    } else {

        detected.textContent =
            "Ders otomatik algılanamadı. Lütfen seç.";

        dersSelect.value = "";

    }

}


baslat();


/* =========================================================
   KAYDET
========================================================= */

async function kaydet() {

    const baslik =
        document.getElementById("baslik")
            .value
            .trim();

    const ders =
        document.getElementById("ders")
            .value
            .trim();

    const aciklama =
        document.getElementById("aciklama")
            .value
            .trim();

    const status =
        document.getElementById("status");

    const button =
        document.getElementById("saveButton");


    status.className =
        "status";

    status.textContent =
        "";


    if (!baslik) {

        hata("Lütfen bir başlık gir.");

        return;

    }


    if (!ders) {

        hata("Ders seçilemedi. Lütfen dersi seç.");

        return;

    }


    if (!aciklama) {

        hata("Lütfen kısa notu yaz.");

        return;

    }


    if (!kaynakUrl) {

        hata(
            "Kaynak Notion sayfasının URL'si bulunamadı."
        );

        return;

    }


    button.disabled =
        true;

    button.textContent =
        "⏳ Kaydediliyor...";


    try {

        const response =
            await fetch(
                WORKER_URL + "/kisa-not-ekle",
                {

                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            baslik:
                                baslik,

                            ders:
                                ders,

                            aciklama:
                                aciklama,

                            kaynakUrl:
                                kaynakUrl

                        })

                }
            );


        const data =
            await response.json()
                .catch(() => ({}));


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Worker hata verdi."
            );

        }


        status.className =
            "status success";

        status.textContent =
            "✓ Kısa not başarıyla Özet Havuzu'na kaydedildi.";


        document.getElementById("baslik")
            .value = "";

        document.getElementById("aciklama")
            .value = "";


    } catch (error) {

        console.error(error);

        hata(
            "Kayıt başarısız: " +
            error.message
        );

    } finally {

        button.disabled =
            false;

        button.textContent =
            "💾 Kısa Notu Kaydet";

    }

}


/* =========================================================
   HATA
========================================================= */

function hata(mesaj) {

    const status =
        document.getElementById("status");

    status.className =
        "status error";

    status.textContent =
        "⚠ " + mesaj;

}


/* =========================================================
   TEMİZLE
========================================================= */

function temizle() {

    document.getElementById("baslik")
        .value = "";

    document.getElementById("aciklama")
        .value = "";

    const status =
        document.getElementById("status");

    status.className =
        "status";

    status.textContent =
        "";

}

</script>

</body>
</html>
