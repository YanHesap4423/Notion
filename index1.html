<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Kısa Not Ekle</title>

<style>

:root {
    --bg: #191919;
    --card: #111111;
    --border: #2d2d2d;
    --text: #eeeeee;
    --muted: #999999;
    --orange: #ff8a00;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
}

body {
    padding: 18px;
}

.container {
    width: min(100%, 700px);
    margin: 0 auto;
}

.card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 22px;
}

.title {
    font-size: 21px;
    font-weight: 700;
    margin-bottom: 4px;
}

.subtitle {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
}

.field {
    margin-bottom: 14px;
}

.field label {
    display: block;
    font-size: 12px;
    color: #b8b8b8;
    margin-bottom: 6px;
}

input,
textarea,
select {
    width: 100%;
    border: 1px solid #343434;
    border-radius: 10px;
    background: #0d0d0d;
    color: #eee;
    padding: 11px 12px;
    outline: none;
}

textarea {
    min-height: 150px;
    resize: vertical;
}

input:focus,
textarea:focus,
select:focus {
    border-color: #555;
}

.source {
    padding: 11px 12px;
    border-radius: 10px;
    background: #191919;
    border: 1px solid #2a2a2a;
    color: #999;
    font-size: 12px;
    word-break: break-all;
    margin-top: 6px;
}

.source.detected {
    color: #d8d8d8;
}

.actions {
    display: grid;
    grid-template-columns:
        1fr 1fr;
    gap: 10px;
    margin-top: 18px;
}

button {
    min-height: 43px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: #1d1d1d;
    color: #eee;
    cursor: pointer;
}

button.primary {
    background: #26190d;
    border-color: #71450f;
    color: #ffae50;
}

button:hover {
    background: #252525;
}

button.primary:hover {
    background: #30200f;
}

.status {
    display: none;
    margin-top: 15px;
    padding: 11px 12px;
    border-radius: 10px;
    font-size: 13px;
}

.status.show {
    display: block;
}

.status.success {
    background: #142017;
    border: 1px solid #28462e;
    color: #aad1b0;
}

.status.error {
    background: #241315;
    border: 1px solid #52282c;
    color: #ffb0b4;
}

.note-preview {
    margin-top: 18px;
    padding: 13px;
    border: 1px solid #272727;
    background: #171717;
    border-radius: 12px;
}

.preview-label {
    font-size: 11px;
    color: #777;
    margin-bottom: 5px;
}

.preview-value {
    font-size: 14px;
    color: #ddd;
    white-space: pre-wrap;
}

@media (max-width: 550px) {

    .actions {
        grid-template-columns: 1fr;
    }

}

</style>

</head>

<body>

<div class="container">

    <div class="card">

        <div class="title">
            📝 Kısa Not Ekle
        </div>

        <div class="subtitle">
            Bu bilgiyi Özet Havuzu'na yeni aktif kayıt olarak ekle.
        </div>


        <div class="field">

            <label>
                Başlık
            </label>

            <input
                id="baslik"
                placeholder="Örn. Küçük Ünlü Uyumu"
            >

        </div>


        <div class="field">

            <label>
                Ders
            </label>

            <select id="ders">

                <option value="">
                    Otomatik algılanacak / seç
                </option>

                <option>TYT Matematik</option>
                <option>TYT Türkçe</option>
                <option>TYT Tarih</option>
                <option>TYT Coğrafya</option>
                <option>TYT Felsefe</option>
                <option>TYT Din Kültürü</option>
                <option>TYT Fizik</option>
                <option>TYT Kimya</option>
                <option>TYT Biyoloji</option>
                <option>AYT Matematik</option>
                <option>AYT Fizik</option>
                <option>AYT Kimya</option>
                <option>AYT Biyoloji</option>

            </select>

        </div>


        <div class="field">

            <label>
                Kısa Not
            </label>

            <textarea
                id="aciklama"
                placeholder="Hatırlamak istediğin bilgiyi yaz..."
            ></textarea>

        </div>


        <div class="field">

            <label>
                Kaynak Sayfa
            </label>

            <div
                id="source"
                class="source"
            >
                Kaynak belirleniyor...
            </div>

        </div>


        <div class="note-preview">

            <div class="preview-label">
                Önizleme
            </div>

            <div
                id="preview"
                class="preview-value"
            >
                Henüz not yazılmadı.
            </div>

        </div>


        <div class="actions">

            <button
                id="clearButton"
            >
                Temizle
            </button>

            <button
                id="saveButton"
                class="primary"
            >
                Kaydet
            </button>

        </div>


        <div
            id="status"
            class="status"
        ></div>

    </div>

</div>


<script>

/* =========================================================
   AYARLAR
========================================================= */

const WORKER_URL =
    "https://yks-bilgi-api.yanhesap100yh.workers.dev";


/* =========================================================
   URL
   En doğru yöntem:
   index1.html?page=NOTION_SAYFASI_URL
========================================================= */

const params =
    new URLSearchParams(
        window.location.search
    );

const kaynakUrl =
    params.get("page") ||
    document.referrer ||
    "";


/* =========================================================
   DOM
========================================================= */

const baslik =
    document.getElementById(
        "baslik"
    );

const ders =
    document.getElementById(
        "ders"
    );

const aciklama =
    document.getElementById(
        "aciklama"
    );

const source =
    document.getElementById(
        "source"
    );

const preview =
    document.getElementById(
        "preview"
    );

const status =
    document.getElementById(
        "status"
    );


/* =========================================================
   DERS OTOMATİK ALGILAMA
========================================================= */

function otomatikDersAlgila(url) {

    const text =
        decodeURIComponent(
            url || ""
        ).toLocaleLowerCase(
            "tr-TR"
        );

    /*
       Doğrudan ders isimleri
    */

    const rules = [

        [
            [
                "tyt-turkce",
                "tyt_turkce",
                "tyt türkçe",
                "türkçe"
            ],
            "TYT Türkçe"
        ],

        [
            [
                "tyt-tarih",
                "tyt_tarih",
                "tyt tarih",
                "tarih"
            ],
            "TYT Tarih"
        ],

        [
            [
                "tyt-cografya",
                "tyt_coğrafya",
                "tyt coğrafya",
                "coğrafya"
            ],
            "TYT Coğrafya"
        ],

        [
            [
                "tyt-felsefe",
                "tyt_felsefe",
                "tyt felsefe",
                "felsefe"
            ],
            "TYT Felsefe"
        ],

        [
            [
                "tyt-biyoloji",
                "tyt_biyoloji",
                "tyt biyoloji",
                "biyoloji"
            ],
            "TYT Biyoloji"
        ],

        [
            [
                "tyt-kimya",
                "tyt_kimya",
                "tyt kimya",
                "kimya"
            ],
            "TYT Kimya"
        ],

        [
            [
                "tyt-fizik",
                "tyt_fizik",
                "tyt fizik",
                "fizik"
            ],
            "TYT Fizik"
        ],

        [
            [
                "ayt-matematik",
                "ayt_matematik",
                "ayt matematik"
            ],
            "AYT Matematik"
        ],

        [
            [
                "tyt-matematik",
                "tyt_matematik",
                "tyt matematik",
                "matematik"
            ],
            "TYT Matematik"
        ],

        [
            [
                "ayt-fizik",
                "ayt_fizik",
                "ayt fizik"
            ],
            "AYT Fizik"
        ],

        [
            [
                "ayt-kimya",
                "ayt_kimya",
                "ayt kimya"
            ],
            "AYT Kimya"
        ],

        [
            [
                "ayt-biyoloji",
                "ayt_biyoloji",
                "ayt biyoloji"
            ],
            "AYT Biyoloji"
        ]

    ];

    for (
        const [keywords, lesson]
        of rules
    ) {

        if (
            keywords.some(
                keyword =>
                    text.includes(
                        keyword
                    )
            )
        ) {
            return lesson;
        }

    }

    /*
       Bilinen konu isimleri
       üzerinden daha özel tahminler.
    */

    if (
        /ses-bilgisi|ses bilgisi/.test(
            text
        )
    ) {
        return "TYT Türkçe";
    }

    if (
        /yazım-kuralları|yazim-kurallari/.test(
            text
        )
    ) {
        return "TYT Türkçe";
    }

    if (
        /insanlığın-ilk-dönemleri|insanligin-ilk-donemleri/.test(
            text
        )
    ) {
        return "TYT Tarih";
    }

    if (
        /tarih-ve-zaman/.test(
            text
        )
    ) {
        return "TYT Tarih";
    }

    if (
        /ilk-ve-orta-çağlarda-türk-dünyası|ilk-ve-orta-caglarda-turk-dunyasi/.test(
            text
        )
    ) {
        return "TYT Tarih";
    }

    if (
        /orta-çağda-dünya|orta-cagda-dunya/.test(
            text
        )
    ) {
        return "TYT Tarih";
    }

    if (
        /canlıların-genel-özellikleri|canlilarin-genel-ozellikleri/.test(
            text
        )
    ) {
        return "TYT Biyoloji";
    }

    return "";
}


/* =========================================================
   KAYNAĞI GÖSTER
========================================================= */

if (kaynakUrl) {

    source.textContent =
        kaynakUrl;

    source.classList.add(
        "detected"
    );

} else {

    source.textContent =
        "Kaynak URL bulunamadı. Manuel ders seçebilirsin.";
}


/* =========================================================
   DERSİ OTOMATİK SEÇ
========================================================= */

const otomatikDers =
    otomatikDersAlgila(
        kaynakUrl
    );

if (otomatikDers) {

    ders.value =
        otomatikDers;

}


/* =========================================================
   ÖNİZLEME
========================================================= */

function updatePreview() {

    if (
        !aciklama.value.trim()
    ) {

        preview.textContent =
            "Henüz not yazılmadı.";

        return;
    }

    preview.textContent =
        aciklama.value.trim();
}

aciklama.addEventListener(
    "input",
    updatePreview
);

baslik.addEventListener(
    "input",
    updatePreview
);


/* =========================================================
   STATUS
========================================================= */

function setStatus(
    message,
    type
) {

    status.textContent =
        message;

    status.className =
        `status show ${type}`;

}


/* =========================================================
   TEMİZLE
========================================================= */

document
    .getElementById(
        "clearButton"
    )
    .addEventListener(
        "click",
        () => {

            baslik.value =
                "";

            aciklama.value =
                "";

            updatePreview();

            setStatus(
                "Form temizlendi.",
                "success"
            );

        }
    );


/* =========================================================
   KAYDET
========================================================= */

document
    .getElementById(
        "saveButton"
    )
    .addEventListener(
        "click",
        saveNote
    );


async function saveNote() {

    const title =
        baslik.value.trim();

    const note =
        aciklama.value.trim();

    const selectedLesson =
        ders.value;

    if (!title) {

        setStatus(
            "Başlık zorunludur.",
            "error"
        );

        baslik.focus();

        return;
    }

    if (!note) {

        setStatus(
            "Kısa not boş bırakılamaz.",
            "error"
        );

        aciklama.focus();

        return;
    }

    /*
       Otomatik algılama başarısızsa
       manual select zorunlu.
    */

    if (!selectedLesson) {

        setStatus(
            "Ders otomatik algılanamadı. Lütfen ders seç.",
            "error"
        );

        ders.focus();

        return;
    }

    const saveButton =
        document.getElementById(
            "saveButton"
        );

    saveButton.disabled =
        true;

    saveButton.textContent =
        "Kaydediliyor...";

    try {

        const response =
            await fetch(
                `${WORKER_URL}/kisa-not-ekle`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({

                            baslik:
                                title,

                            ders:
                                selectedLesson,

                            aciklama:
                                note,

                            kaynakUrl:
                                kaynakUrl

                        })
                }
            );

        const result =
            await response.json();

        if (
            !response.ok ||
            !result.success
        ) {

            throw new Error(
                result.error ||
                "Kayıt sırasında hata oluştu."
            );
        }

        setStatus(
            "Kısa not başarıyla Özet Havuzu'na eklendi.",
            "success"
        );

        baslik.value =
            "";

        aciklama.value =
            "";

        updatePreview();

    } catch (error) {

        console.error(
            error
        );

        setStatus(
            error.message ||
                "Kayıt sırasında hata oluştu.",
            "error"
        );

    } finally {

        saveButton.disabled =
            false;

        saveButton.textContent =
            "Kaydet";

    }

}


/* =========================================================
   BAŞLANGIÇ
========================================================= */

updatePreview();

</script>

</body>

</html>
